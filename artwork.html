<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>אוספי מוזיאון ישראל</title>
  <meta name="description" content="צפו ביצירה מתוך אוספי מוזיאון ישראל, עם פרטי טכניקה, מקור ומידות." />
  <link rel="icon" type="image/svg+xml" href="public/images/favicon.svg" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <!-- Static snapshot of Tailwind's generated utility CSS, loaded as a
       real stylesheet before the CDN script below. The Play CDN script
       generates its CSS client-side by scanning the DOM after React
       mounts, which leaves a real window where elements using classes
       like "absolute" or "flex" for actual layout render unpositioned
       until it catches up — usually invisible on a fast local server,
       but visible as a broken/unstyled flash on a slower connection.
       This link tag is render-blocking (guaranteed present on first
       paint) and covers every utility class this site actually uses;
       the CDN script stays below as a safety net for anything it
       doesn't. -->
  <link rel="stylesheet" href="tailwind.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="artworks-data.js"></script>
  <script src="search-engine.js"></script>
  <style>
    @view-transition {
      navigation: auto;
    }
    ::view-transition-group(root) {
      animation-duration: 0.42s;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    ::view-transition-old(root),
    ::view-transition-new(root) {
      mix-blend-mode: normal;
    }
    /* The nav bar carries a persistent view-transition-name (site-header) so
       it morphs instead of cross-fading — but the browser still runs its
       default old/new fade *underneath* that morph, and since the two
       snapshots are almost-but-not-quite pixel-identical (font hinting,
       subpixel rounding) that reads as a flicker. Freezing it removes that. */
    ::view-transition-old(site-header),
    ::view-transition-new(site-header) {
      animation: none;
      mix-blend-mode: normal;
    }
    /* Also freeze the group's own position/size interpolation — otherwise
       even a 1px geometry mismatch between two pages' headers (they're
       hand-tuned per page) makes it visibly slide during the crossfade. */
    ::view-transition-group(site-header) {
      animation: none;
    }
    @font-face {
      font-family: 'TheBasics';
      src: url('public/fonts/TheBasics-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheBasics';
      src: url('public/fonts/TheBasics-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheBasics';
      src: url('public/fonts/TheBasics-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Masada';
      src: url('public/fonts/Masada-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      background-color: #fffdfa;
      color: #28282a;
      font-family: 'TheBasics', 'Segoe UI', Arial, sans-serif;
      font-weight: 500;
    }

    ::selection {
      background-color: #28282a;
      color: #fffdfa;
    }
  </style>
</head>
<body>
  <!-- Static, JS-free header: React/ReactDOM/Babel-standalone all load from a
       CDN and the whole page script has to be parsed and transpiled before
       React paints anything, so on every navigation there's a real gap where
       the document is blank and the nav bar vanishes. This markup needs no
       JS at all, so it paints on the very first frame and carries the
       site-header view-transition name itself (the React-rendered header
       below no longer claims it — a name can only be claimed by one element
       at a time). It sits one z-index below the real header and is never
       removed; once React mounts, its own header simply covers this one, so
       there's no visible swap — as long as both agree on exact geometry
       (right/top/width/height/gap below), which is why those are hardcoded
       to match every page's own HeaderWordmarkLink/TopNav values exactly
       rather than copy-pasted loosely. -->
  <div style="position:fixed;inset-inline:0;top:0;z-index:29;display:flex;justify-content:center;pointer-events:none;view-transition-name:site-header;">
    <div dir="rtl" style="position:relative;width:min(1728px,100vw);">
      <a href="index.html" style="position:absolute;right:calc(min(1728px,100vw) * 0.013889);top:calc(min(1728px,100vw) * 0.017940);width:calc(min(1728px,100vw) * 0.142940);height:calc(min(1728px,100vw) * 0.014468);pointer-events:auto;display:block;">
        <img src="public/images/wordmark.svg" alt="אוספי מוזיאון ישראל" style="width:100%;height:100%;display:block;" />
      </a>
      <nav dir="rtl" style="position:absolute;inset-inline-end:calc(min(1728px,100vw) * 0.013889);top:calc(min(1728px,100vw) * 0.018519);display:flex;align-items:center;gap:20px;pointer-events:auto;font-family:'TheBasics','Segoe UI',Arial,sans-serif;font-weight:500;font-size:calc(min(1728px,100vw) * 0.011574);letter-spacing:0.2px;">
        <a href="index.html#about" style="color:#28282a;text-decoration:none;">אסופות</a>
        <a href="collection-index.html" style="color:#28282a;text-decoration:none;">אינדקס</a>
        <a href="search.html" style="color:#28282a;text-decoration:none;">חיפוש</a>
        <a href="about.html" style="color:#28282a;text-decoration:none;">אודות</a>
      </nav>
    </div>
  </div>

  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useRef, useEffect } = React;

    const FONT_THEBASICS = "TheBasics, \"Segoe UI\", Arial, sans-serif";
    const FONT_MASADA = "Masada, \"Segoe UI\", Arial, sans-serif";

    const UNDERLINE_OFFSET = "0.08em";
    const UNDERLINE_THICKNESS = "0.1em";

    const FRAME_W = 1728;
    const scalePx = (px) => `calc(min(${FRAME_W}px, 100vw) * ${(px / FRAME_W).toFixed(6)})`;
    const CANVAS_W = "w-[1728px] max-w-full";

    const HERO_VIDEOS = [
      "public/videos/circle_1.mp4",
      "public/videos/vertical_landscape.mp4",
      "public/videos/window_1.mp4",
      "public/videos/motion.mp4",
      "public/videos/shard_1.mp4",
    ];

    const WORDMARK_HOVER_FADE_MS = 200;

    function HeaderWordmarkLink({ style }) {
      const [video, setVideo] = useState(null);
      const [mounted, setMounted] = useState(false);
      const [visible, setVisible] = useState(false);
      const rafIds = useRef([]);
      const closeTimer = useRef(null);

      useEffect(() => {
        rafIds.current.forEach((id) => cancelAnimationFrame(id));
        rafIds.current = [];
        clearTimeout(closeTimer.current);
        if (video) {
          setMounted(true);
          setVisible(false);
          rafIds.current.push(requestAnimationFrame(() => {
            rafIds.current.push(requestAnimationFrame(() => setVisible(true)));
          }));
        } else if (mounted) {
          setVisible(false);
          closeTimer.current = setTimeout(() => setMounted(false), WORDMARK_HOVER_FADE_MS);
        }
        return () => {
          rafIds.current.forEach((id) => cancelAnimationFrame(id));
          rafIds.current = [];
          clearTimeout(closeTimer.current);
        };
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [video]);

      return (
        <a
          href="index.html"
          className="absolute pointer-events-auto"
          style={{ ...style, zIndex: 41 }}
          onMouseEnter={() => setVideo(HERO_VIDEOS[Math.floor(Math.random() * HERO_VIDEOS.length)])}
          onMouseLeave={() => setVideo(null)}
          onClick={() => {
            if (video) sessionStorage.setItem("heroVideo", video);
          }}
        >
          <img src="public/images/wordmark.svg" alt="אוספי מוזיאון ישראל" style={{ width: "100%", height: "100%", display: "block", position: "relative", zIndex: 2 }} />
          {mounted && (
            <div
              className="fixed inset-0 overflow-hidden pointer-events-none"
              style={{ zIndex: 1, opacity: visible ? 1 : 0, transition: `opacity ${WORDMARK_HOVER_FADE_MS}ms ease` }}
            >
              <video key={video} src={video} autoPlay loop muted playsInline className="w-full h-full object-cover" />
            </div>
          )}
        </a>
      );
    }

    const WORDMARK_ICONS = [
      "public/images/icon-circle.svg",
      "public/images/icon-verticality.svg",
      "public/images/icon-gate.svg",
      "public/images/icon-motion.svg",
      "public/images/icon-fragment.svg",
    ];
    const WORDMARK_ICON_SLOTS = [
      { left: 1135.5, top: 30.3, width: 122.4, height: 118.9 },
      { left: 475.3, top: 30.3, width: 117.4, height: 118.9 },
    ];
    const WORDMARK_ICON_INTERVAL_MS = 200;

    function AnimatedFooterWordmark({ style, id }) {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        const t = setInterval(() => setTick((n) => n + 1), WORDMARK_ICON_INTERVAL_MS);
        return () => clearInterval(t);
      }, []);
      return (
        <div id={id} className="absolute" style={{ ...style, position: "absolute" }}>
          <img src="public/images/wordmark-blank.svg" alt="אוספי מוזיאון ישראל" style={{ width: "100%", height: "100%" }} />
          {WORDMARK_ICON_SLOTS.map((slot, i) => (
            <img
              key={i}
              src={WORDMARK_ICONS[(tick + i * 2) % WORDMARK_ICONS.length]}
              alt=""
              aria-hidden="true"
              style={{ position: "absolute", objectFit: "contain", left: scalePx(slot.left), top: scalePx(slot.top), width: scalePx(slot.width), height: scalePx(slot.height) }}
            />
          ))}
        </div>
      );
    }

    const NAV_ITEMS = [
      { label: "אינדקס", href: "collection-index.html" },
      { label: "חיפוש", href: "#search" },
      { label: "אודות", href: "about.html" },
    ];

    // The motif row doubles as the "which collection am I in" indicator: the
    // artwork's own motif renders underlined and unlinked, the rest link out.
    const MOTIFS = [
      { label: "מעגל", href: "collection-circle.html", icon: "public/images/icon-circle.svg" },
      { label: "אנכיות", href: "collection-verticality.html", icon: "public/images/icon-verticality.svg" },
      { label: "שער", href: "collection-gate.html", icon: "public/images/icon-gate.svg" },
      { label: "תנועה", href: "collection-motion.html", icon: "public/images/icon-motion.svg" },
      { label: "שבר", href: "collection-shard.html", icon: "public/images/icon-fragment.svg" },
    ];

    function NavLink({ label, href, onClick }) {
      const [visible, setVisible] = useState(false);
      const [origin, setOrigin] = useState("right");
      const [resetKey, setResetKey] = useState(0);
      const rafIds = useRef([]);

      function clearRafs() {
        rafIds.current.forEach((id) => cancelAnimationFrame(id));
        rafIds.current = [];
      }
      function handleEnter() {
        // Clicking a focusable link fires onFocus even though the mouse
        // never left — without this guard that replays the whole closed-
        // then-sweep-in animation as a visible glitch right at the click.
        if (visible) return;
        clearRafs();
        setOrigin("right");
        setVisible(false);
        setResetKey((k) => k + 1);
        rafIds.current.push(requestAnimationFrame(() => {
          rafIds.current.push(requestAnimationFrame(() => setVisible(true)));
        }));
      }
      function handleLeave() {
        clearRafs();
        setOrigin("left");
        setVisible(false);
      }
      const clipPath = visible ? "inset(0 0 0 0)" : origin === "right" ? "inset(0 0 0 100%)" : "inset(0 100% 0 0)";

      return (
        <a
          href={href}
          onClick={onClick}
          onMouseEnter={handleEnter}
          onMouseLeave={handleLeave}
          onFocus={handleEnter}
          onBlur={handleLeave}
          className="relative inline-block text-[#28282a]"
          style={{ textDecoration: "none" }}
        >
          {label}
          <span
            key={resetKey}
            aria-hidden="true"
            className="absolute inset-0 pointer-events-none"
            style={{
              color: "transparent",
              textDecorationLine: "underline",
              textDecorationColor: "#28282a",
              textDecorationThickness: UNDERLINE_THICKNESS,
              textUnderlineOffset: UNDERLINE_OFFSET,
              textDecorationSkipInk: "auto",
              clipPath,
              transition: "clip-path 0.16s ease",
            }}
          >
            {label}
          </span>
        </a>
      );
    }

    const CURRENT_UNDERLINE = {
      textDecorationLine: "underline",
      textDecorationColor: "#28282a",
      textDecorationThickness: UNDERLINE_THICKNESS,
      textUnderlineOffset: UNDERLINE_OFFSET,
      textDecorationSkipInk: "auto",
    };

    function TopNav({ onSearchToggle }) {
      return (
        <nav
          className="flex items-center gap-5 pointer-events-auto"
          dir="rtl"
          style={{ fontFamily: FONT_THEBASICS, fontSize: scalePx(20), letterSpacing: "0.2px" }}
        >
          <a
            href="index.html#about"
            onClick={() => {
              sessionStorage.setItem("skipIntro", "1");
              sessionStorage.setItem("scrollToAbout", "1");
            }}
            className="inline-block text-[#28282a]"
            style={{ textDecoration: "none", ...CURRENT_UNDERLINE }}
          >
            אסופות
          </a>
          {NAV_ITEMS.map((item) => (
            <NavLink
              key={item.label}
              label={item.label}
              href={item.href}
              // "חיפוש" doesn't navigate — it toggles the search bar (see
              // SearchBar/App). stopPropagation keeps this same click from
              // also being seen by SearchBar's document-level away-listener,
              // which would otherwise immediately close what this just opened.
              onClick={item.label === "חיפוש" ? (e) => { e.preventDefault(); e.stopPropagation(); onSearchToggle(); } : undefined}
            />
          ))}
        </nav>
      );
    }

    const SEARCH_FADE_MS = 180;
    const SEARCH_PLACEHOLDER = "חפש.י לפי אסופה, יצירה או יוצר.ת...";
    const SEARCH_MAX_RESULTS = 8;
    const CARET_BLINK_MS = 530;

    // Matching lives in search-engine.js so this dropdown and the full results
    // page (search.html) can never disagree about what a query means. It
    // returns the complete list; the dropdown shows the first
    // SEARCH_MAX_RESULTS and links the rest through to search.html.
    function searchArtworks(query) {
      return window.MuseumSearch.run(query).results;
    }

    function SearchBar({ open, onClose }) {
      const [mounted, setMounted] = useState(false);
      const [visible, setVisible] = useState(false);
      const [query, setQuery] = useState("");
      const rafIds = useRef([]);
      const closeTimer = useRef(null);
      const wrapperRef = useRef(null);
      const inputRef = useRef(null);
      const allResults = searchArtworks(query);
      const results = allResults.slice(0, SEARCH_MAX_RESULTS);

      function goToResult(art) {
        window.location.href = "artwork.html?id=" + art.id;
      }

      // Fake caret matching the stroke's own weight (scalePx(4)) — the real
      // <input> keeps native focus/selection/typing, but its own caret is
      // hidden (caret-color: transparent) since browsers don't expose a way
      // to make that thin native bar match our 4px line. This bar is
      // repositioned by measuring the pre-cursor substring on a scratch
      // canvas (matching the input's own live computed font), same
      // measure-in-browser technique used throughout this file for text
      // fitting — cheap enough to run on every keystroke.
      const [caretOffset, setCaretOffset] = useState(0);
      const [caretOn, setCaretOn] = useState(true);
      const [caretFocused, setCaretFocused] = useState(false);
      const measureCtxRef = useRef(null);
      const blinkTimerRef = useRef(null);

      function measureCaret() {
        const el = inputRef.current;
        if (!el) return;
        if (!measureCtxRef.current) measureCtxRef.current = document.createElement("canvas").getContext("2d");
        const cs = getComputedStyle(el);
        measureCtxRef.current.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        const pos = el.selectionStart == null ? el.value.length : el.selectionStart;
        setCaretOffset(measureCtxRef.current.measureText(el.value.slice(0, pos)).width);
      }

      function restartBlink() {
        setCaretOn(true);
        clearInterval(blinkTimerRef.current);
        blinkTimerRef.current = setInterval(() => setCaretOn((v) => !v), CARET_BLINK_MS);
      }

      useEffect(() => {
        if (!caretFocused) { clearInterval(blinkTimerRef.current); return; }
        restartBlink();
        return () => clearInterval(blinkTimerRef.current);
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [caretFocused]);

      useEffect(() => {
        rafIds.current.forEach((id) => cancelAnimationFrame(id));
        rafIds.current = [];
        clearTimeout(closeTimer.current);
        if (open) {
          setMounted(true);
          setVisible(false);
          rafIds.current.push(requestAnimationFrame(() => {
            rafIds.current.push(requestAnimationFrame(() => setVisible(true)));
          }));
        } else if (mounted) {
          setVisible(false);
          setQuery("");
          if (inputRef.current) inputRef.current.value = "";
          closeTimer.current = setTimeout(() => setMounted(false), SEARCH_FADE_MS);
        }
        return () => {
          rafIds.current.forEach((id) => cancelAnimationFrame(id));
          rafIds.current = [];
          clearTimeout(closeTimer.current);
        };
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [open]);

      useEffect(() => {
        if (open && visible && inputRef.current) inputRef.current.focus();
      }, [open, visible]);

      // Click-away and Escape both close it. This listens on "click" (not
      // "mousedown") specifically so the toggle's own stopPropagation — fired
      // during the same click event — can suppress it; a mousedown listener
      // would fire on a different, earlier event and miss that suppression.
      useEffect(() => {
        if (!open) return;
        function onDocClick(e) {
          if (wrapperRef.current && !wrapperRef.current.contains(e.target)) onClose();
        }
        function onKeyDown(e) {
          if (e.key === "Escape") onClose();
          if (e.key === "Enter") {
            // Enter goes to the full results list rather than jumping straight
            // into the top hit — a query like "אדום" has 27 matches and the
            // dropdown only ever shows 8 of them.
            window.location.href = window.MuseumSearch.urlFor(inputRef.current ? inputRef.current.value : "");
          }
        }
        document.addEventListener("click", onDocClick);
        document.addEventListener("keydown", onKeyDown);
        return () => {
          document.removeEventListener("click", onDocClick);
          document.removeEventListener("keydown", onKeyDown);
        };
      }, [open, onClose]);

      if (!mounted) return null;

      return (
        <div
          ref={wrapperRef}
          className="absolute pointer-events-auto"
          style={{
            left: 0,
            right: 0,
            top: scalePx(0),
            height: scalePx(70),
            zIndex: 50,
            backgroundColor: "#fffdfa",
            opacity: visible ? 1 : 0,
            transition: `opacity ${SEARCH_FADE_MS}ms ease`,
          }}
        >
          <div
            className="absolute"
            style={{ left: 0, right: 0, top: scalePx(66), borderBottom: `${scalePx(4)} solid #28282a` }}
          />
          <input
            ref={inputRef}
            type="text"
            dir="rtl"
            placeholder={SEARCH_PLACEHOLDER}
            className="absolute bg-transparent outline-none text-right placeholder:text-[#28282a]"
            style={{
              right: scalePx(15),
              left: scalePx(15),
              top: scalePx(10),
              height: scalePx(56),
              fontFamily: FONT_THEBASICS,
              fontWeight: 500,
              fontSize: scalePx(58),
              lineHeight: 1.21,
              color: "#28282a",
              caretColor: "transparent",
            }}
            onFocus={() => { setCaretFocused(true); setQuery(inputRef.current.value); measureCaret(); restartBlink(); }}
            onBlur={() => setCaretFocused(false)}
            onInput={(e) => { setQuery(e.target.value); measureCaret(); restartBlink(); }}
            onKeyUp={() => { measureCaret(); restartBlink(); }}
            onClick={() => { measureCaret(); restartBlink(); }}
          />
          {caretFocused && query && (
            <div
              className="absolute pointer-events-none"
              style={{
                right: `calc(${scalePx(15)} + ${caretOffset}px)`,
                top: scalePx(8),
                height: scalePx(48),
                width: scalePx(4),
                backgroundColor: "#28282a",
                opacity: caretOn ? 1 : 0,
              }}
            />
          )}
          {query.trim() && (
            <div
              className="absolute"
              style={{
                left: 0,
                right: 0,
                top: scalePx(70),
                backgroundColor: "#fffdfa",
              }}
            >
              {results.length === 0 ? (
                <div
                  dir="rtl"
                  className="text-right"
                  style={{
                    padding: `${scalePx(18)} ${scalePx(15)}`,
                    fontFamily: FONT_THEBASICS,
                    fontSize: scalePx(20),
                    color: "rgba(40, 40, 42, 0.6)",
                  }}
                >
                  אין תוצאות
                </div>
              ) : (
                results.map((art, i) => (
                  <div
                    key={art.id}
                    dir="rtl"
                    onClick={() => goToResult(art)}
                    className="flex items-baseline justify-between cursor-pointer"
                    style={{
                      padding: `${scalePx(14)} ${scalePx(15)}`,
                      borderBottom: (i < results.length - 1 || allResults.length > results.length) ? "1px solid rgba(40, 40, 42, 0.2)" : "none",
                      fontFamily: FONT_THEBASICS,
                    }}
                  >
                    <span style={{ fontWeight: 500, fontSize: scalePx(22) }}>
                      {art.title}
                      {art.artist && (
                        <span style={{ fontWeight: 400, color: "rgba(40, 40, 42, 0.6)" }}> {art.artist}</span>
                      )}
                    </span>
                    <span style={{ fontSize: scalePx(16), color: "rgba(40, 40, 42, 0.5)", flexShrink: 0, marginInlineStart: scalePx(12) }}>
                      {art.motif}
                    </span>
                  </div>
                ))
              )}
              {allResults.length > results.length && (
                <div
                  dir="rtl"
                  onClick={() => { window.location.href = window.MuseumSearch.urlFor(query); }}
                  className="text-right cursor-pointer"
                  style={{
                    padding: `${scalePx(14)} ${scalePx(15)}`,
                    fontFamily: FONT_THEBASICS,
                    fontSize: scalePx(20),
                    color: "rgba(40, 40, 42, 0.6)",
                  }}
                >
                  {`כל התוצאות (${allResults.length})`}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function MotifTagRow({ current }) {
      return (
        <div
          className="flex items-baseline gap-3"
          dir="rtl"
          style={{ fontFamily: FONT_THEBASICS, fontSize: scalePx(40), letterSpacing: "-0.8px" }}
        >
          {MOTIFS.map((m, i) => {
            const text = i < MOTIFS.length - 1 ? m.label + "," : m.label;
            return m.label === current ? (
              <span key={m.label} style={CURRENT_UNDERLINE}>{text}</span>
            ) : (
              <NavLink key={m.label} label={text} href={m.href} />
            );
          })}
        </div>
      );
    }

    // ---- detail-page pieces -------------------------------------------------

    const BODY_LINE_H = 1.28;
    const BODY_SIZE = 20;
    const META_LINE_H = 1.22;
    // Row rhythm measured off the Figma frames: text, a 5px breath, the rule,
    // then 8px before the next row starts.
    const META_RULE_GAP = 5;
    const META_ROW_GAP = 8;

    function BodyCopy({ paragraphs }) {
      return (
        <>
          {paragraphs.map((segments, pi) => (
            <p
              key={pi}
              dir="rtl"
              style={{ marginBottom: pi < paragraphs.length - 1 ? scalePx(BODY_SIZE * BODY_LINE_H) : 0 }}
            >
              {segments.map((seg, si) =>
                seg.br ? (
                  <br key={si} />
                ) : seg.u ? (
                  <span key={si} style={CURRENT_UNDERLINE}>{seg.t}</span>
                ) : (
                  <span key={si}>{seg.t}</span>
                )
              )}
            </p>
          ))}
        </>
      );
    }

    function MetaTable({ rows, top, width, right }) {
      return (
        <div
          id="aw-meta"
          className="absolute text-right"
          dir="rtl"
          style={{
            right: scalePx(right ?? 24),
            top: scalePx(top),
            width: scalePx(width || 330),
            fontFamily: FONT_THEBASICS,
            fontSize: scalePx(BODY_SIZE),
            lineHeight: META_LINE_H,
          }}
        >
          {rows.map((row, i) => (
            <div key={i}>
              <div>{row}</div>
              {i < rows.length - 1 && (
                <div
                  aria-hidden="true"
                  style={{
                    marginTop: scalePx(META_RULE_GAP),
                    marginBottom: scalePx(META_ROW_GAP),
                    borderTop: "1px solid rgba(40, 40, 42, 0.34)",
                  }}
                />
              )}
            </div>
          ))}
        </div>
      );
    }

    // The 22 frames that exist in Figma carry their own measured geometry.
    // Everything else derives it from the work's aspect ratio against the same
    // envelope those frames occupy, so a new record only has to supply content.
    // Envelope measured off the 22 Figma frames: their renders span 445–993
    // wide and 666–1539 tall (means 766 × 1058). The old 820 × 990 box clipped
    // tall works badly — a 0.29-aspect standing bronze came out 286 × 990
    // against the frame's own 445 × 1539 — so the cap now clears the reference
    // range and each work fills whichever bound its aspect reaches first.
    const FIT_MAX_W = 840;
    const FIT_MAX_H = 1400;
    const GUTTER = 24;
    // 17 of the 22 frames run the blurb *past* the artwork's left edge rather
    // than clearing it (overlaps −29…+86, mode +20/21). Derived records now do
    // the same: the column's right edge sits this far inside the render.
    const BLURB_OVERLAP = 21;
    const DEFAULTS = { imgTop: 115, bodyTop: 190, bodyWidth: 470, metaTop: 700 };

    function geometryFor(art) {
      const g = Object.assign({}, DEFAULTS, art);
      if (!g.imgW || !g.imgH) {
        const ar = art.ar || 1;                       // width / height
        let w = FIT_MAX_H * ar, h = FIT_MAX_H;
        if (w > FIT_MAX_W) { w = FIT_MAX_W; h = FIT_MAX_W / ar; }
        g.imgW = Math.round(w);
        g.imgH = Math.round(h);
      }
      if (!g.bodyRight) {
        g.bodyRight = Math.round(864 - g.imgW / 2) + BLURB_OVERLAP;
        // Still has to fit between that edge and the canvas margin, which is
        // what keeps a near-full-width render from pushing the column off-page.
        g.bodyWidth = Math.min(g.bodyWidth, g.bodyRight - GUTTER);
      }
      return g;
    }

    const THUMB_H = 100;

    // Prev/next sit in the left and right margins beside the artwork — the
    // thumbnail alone is the affordance, no arrow glyph.
    function NeighbourLink({ artwork, side, top, thumbH, thumbW, gutter }) {
      if (!artwork) return null;
      const h = thumbH || THUMB_H;
      const g = geometryFor(artwork);
      // A fixed thumbW overrides the aspect-derived width so mismatched
      // portrait/landscape neighbours can be forced to the same footprint —
      // the box then crops via objectFit:cover instead of matching it exactly.
      const w = thumbW || Math.round(h * (g.imgW / g.imgH));
      const [hovered, setHovered] = useState(false);
      return (
        <a
          href={"artwork.html?id=" + artwork.id}
          title={artwork.title}
          className="absolute block"
          style={{ [side]: scalePx(gutter != null ? gutter : 24), top: scalePx(top) }}
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
        >
          <div style={{ position: "relative", width: scalePx(w), height: scalePx(h), overflow: "hidden" }}>
            <img
              src={artwork.image}
              alt={artwork.title}
              style={
                artwork.rotateImage
                  ? {
                      position: "absolute", left: "50%", top: "50%",
                      width: scalePx(h), height: scalePx(w),
                      transform: `translate(-50%, -50%) rotate(${artwork.rotateImage}deg)`,
                      objectFit: "cover", objectPosition: "center",
                      filter: hovered ? "grayscale(0)" : "grayscale(1)",
                      transition: "filter 250ms ease",
                    }
                  : {
                      width: scalePx(w), height: scalePx(h), objectFit: "cover", display: "block",
                      filter: hovered ? "grayscale(0)" : "grayscale(1)",
                      transition: "filter 250ms ease",
                    }
              }
            />
          </div>
        </a>
      );
    }

    function App() {
      const [fadeIn, setFadeIn] = useState(false);
      const [searchOpen, setSearchOpen] = useState(false);
      useEffect(() => {
        const t = setTimeout(() => setFadeIn(true), 60);
        return () => clearTimeout(t);
      }, []);

      const list = window.ARTWORKS || [];
      const requested = new URLSearchParams(location.search).get("id");
      const index = Math.max(0, list.findIndex((a) => a.id === requested));
      const art = list[index];

      if (!art) {
        return (
          <div className="min-h-screen flex items-center justify-center" dir="rtl" style={{ fontSize: 20 }}>
            <p>
              היצירה לא נמצאה. <a href="collection-index.html" style={CURRENT_UNDERLINE}>חזרה לאינדקס</a>
            </p>
          </div>
        );
      }

      const motif = MOTIFS.find((m) => m.label === art.motif) || MOTIFS[0];

      // Prev/next walk the work's own אסופה in the order its grid lays the
      // tiles out (`order` is the card's index on that collection page), not
      // the order records happen to sit in ARTWORKS. Wraps within the אסופה.
      const siblings = list
        .filter((a) => a.motif === art.motif)
        .sort((a, b) => (a.order || 0) - (b.order || 0));
      const here = siblings.findIndex((a) => a.id === art.id);
      const prev = siblings[(here - 1 + siblings.length) % siblings.length];
      const next = siblings[(here + 1) % siblings.length];

      const g = geometryFor(art);

      // The nav row and footer hang off whichever runs longer — the artwork
      // render or the metadata column — so pages of different heights keep the
      // same spacing instead of inheriting each frame's hand-placed offsets.
      const contentBottom = Math.max(g.imgTop + g.imgH, (g.dimsTop || 0) + 80, 1085);
      // Prev/next thumbnails sit on contentBottom, not the image's own bottom
      // edge — for a tall render (a near-full-height hand-axe) that's the same
      // number, but for a short/wide one (a landscape painting) the blurb and
      // metadata column keep running well past where the image ends, and nav
      // pinned to the image alone floated mid-page, overlapping still-running
      // body copy. contentBottom already resolves to whichever of the two —
      // image or text column — actually runs longer.
      // A record can pull this up a bit (navTop) or size the thumbnails up
      // (navSize) when the default reads too small/low for that page.
      const NAV_TOP = art.navTop != null ? art.navTop : contentBottom;
      const NAV_SIZE = art.navSize || THUMB_H;
      const NAV_SIZE_RIGHT = art.navSizeRight || NAV_SIZE;
      const NAV_WIDTH = art.navWidth || null;
      const NAV_GUTTER_RIGHT = art.navGutterRight;
      const FOOTER_PARAGRAPH_TOP = contentBottom + 145;
      const FOOTER_LINKS_TOP = FOOTER_PARAGRAPH_TOP + 48;
      const FOOTER_WORDMARK_TOP = FOOTER_LINKS_TOP + 74;
      const CANVAS_H = FOOTER_WORDMARK_TOP + 188;

      return (
        <div className="min-h-screen w-full bg-[#fffdfa] relative" dir="rtl">
          <div id="aw-header-overlay" className="fixed inset-x-0 top-0 z-30 flex justify-center pointer-events-none">
            <div className={"relative " + CANVAS_W}>
              <div className="absolute pointer-events-auto" style={{ insetInlineEnd: scalePx(24), top: scalePx(32) }}>
                <TopNav onSearchToggle={() => setSearchOpen((v) => !v)} />
              </div>
              <div className="absolute pointer-events-auto" style={{ left: scalePx(614), top: scalePx(19) }}>
                <MotifTagRow current={art.motif} />
              </div>
              <HeaderWordmarkLink style={{ right: scalePx(24), top: scalePx(31), width: scalePx(247), height: scalePx(25) }} />
              <SearchBar open={searchOpen} onClose={() => setSearchOpen(false)} />
            </div>
          </div>

          <div
            id="aw-canvas"
            className={"relative mx-auto " + CANVAS_W}
            style={{
              height: scalePx(CANVAS_H),
              overflow: "clip",
              opacity: fadeIn ? 1 : 0,
              transition: "opacity 500ms ease",
              marginTop: scalePx(10),
            }}
          >
            {/* The אסופה symbol lives in the canvas, not the fixed header, so
                it scrolls away with the work instead of trailing the reader
                down the page. */}
            <a
              id="aw-motif-icon"
              href={motif.href}
              className="absolute"
              title={motif.label}
              style={{ right: scalePx(24), top: scalePx(189), width: scalePx(43), height: scalePx(42) }}
            >
              <img src={motif.icon} alt={motif.label} style={{ width: "100%", height: "100%", objectFit: "contain" }} />
            </a>

            <div
              className="absolute"
              style={{
                left: art.imgOffsetX ? `calc(50% + ${scalePx(art.imgOffsetX)})` : "50%",
                transform: "translateX(-50%)",
                top: scalePx(g.imgTop),
                width: scalePx(g.imgW),
                height: scalePx(g.imgH),
                overflow: "hidden",
              }}
            >
              <img
                id="aw-image"
                src={art.image}
                alt={art.title}
                style={
                  art.rotateImage
                    ? {
                        position: "absolute", left: "50%", top: "50%",
                        width: scalePx(g.imgH), height: scalePx(g.imgW),
                        transform: `translate(-50%, -50%) rotate(${art.rotateImage}deg)`,
                        objectFit: "cover", objectPosition: "center",
                      }
                    : {
                        width: "100%",
                        height: "100%",
                        // Several frames crop their render to the box rather than
                        // fitting it (Figma nests the image in an overflow-clip
                        // wrapper, always centred), so cover reproduces every frame —
                        // it is a no-op where the export already matches the box.
                        objectFit: "cover",
                        objectPosition: "center",
                      }
                }
              />
            </div>

            <h1
              id="aw-title"
              className="absolute text-right"
              dir="rtl"
              style={{
                right: scalePx(24),
                top: scalePx(286),
                width: scalePx(art.titleWidth || 430),
                fontFamily: FONT_MASADA,
                fontWeight: 500,
                fontSize: scalePx(74),
                lineHeight: art.titleLineHeight || 1.05,
                letterSpacing: art.titleLetterSpacing != null ? art.titleLetterSpacing : "-1.48px",
              }}
            >
              {art.title.split("\n").map((line, i, arr) => (
                <React.Fragment key={i}>
                  {line}
                  {i < arr.length - 1 && <br />}
                </React.Fragment>
              ))}
            </h1>

            {art.artist && (
              <p
                id="aw-artist"
                className="absolute text-right"
                dir="rtl"
                style={{
                  right: scalePx(24),
                  // Sits directly under the title, so frames whose title wraps
                  // to two lines push it down via artistTop.
                  top: scalePx(art.artistTop || 350),
                  width: scalePx(art.artistWidth || (art.artistTop ? 407 : 330)),
                  fontFamily: FONT_THEBASICS,
                  fontSize: scalePx(BODY_SIZE),
                  lineHeight: META_LINE_H,
                }}
              >
                {art.artist}
              </p>
            )}

            <MetaTable rows={art.meta} top={g.metaTop} width={art.metaWidth} right={art.metaRight} />

            {/* The left column. A measured frame pins its dimensions block at
                its own dimsTop; without one the block simply follows the blurb
                in flow, which cannot collide however long the blurb runs. */}
            {(() => {
              const measures = (
                <React.Fragment>
                  {/* Omitted entirely when the museum record gives no measured
                      size — the line is only ever shown for a sourced one. */}
                  {art.dimensions && (
                    <p id="aw-dimensions" style={{ letterSpacing: "-0.4px", lineHeight: 1.2 }}>
                      {/* Usually one plain line, but a frame with two measured
                          parts gives it the segment array the body copy uses. */}
                      {typeof art.dimensions === "string"
                        ? art.dimensions
                        : art.dimensions.map((seg, i) =>
                            seg.br ? (
                              <br key={i} />
                            ) : seg.u ? (
                              <span key={i} style={CURRENT_UNDERLINE}>{seg.t}</span>
                            ) : (
                              <span key={i}>{seg.t}</span>
                            )
                          )}
                    </p>
                  )}
                  <p id="aw-tags" style={{ marginTop: scalePx(10), lineHeight: 1.04 }}>
                    {art.tags.map((tag, i) => {
                      const m = MOTIFS.find((x) => x.label === tag);
                      return (
                        <React.Fragment key={tag}>
                          {i > 0 && <span> / </span>}
                          {m ? <NavLink label={tag} href={m.href} /> : <span>{tag}</span>}
                        </React.Fragment>
                      );
                    })}
                  </p>
                </React.Fragment>
              );
              const column = {
                left: scalePx(g.bodyRight - g.bodyWidth),
                width: scalePx(g.bodyWidth),
                fontFamily: FONT_THEBASICS,
                fontSize: scalePx(BODY_SIZE),
              };
              return (
                <React.Fragment>
                  <div
                    id="aw-body"
                    className="absolute text-right"
                    dir="rtl"
                    style={{ ...column, top: scalePx(g.bodyTop) }}
                  >
                    <div style={{ lineHeight: art.bodyLineHeight || BODY_LINE_H, letterSpacing: art.bodyLetterSpacing != null ? art.bodyLetterSpacing : "-0.2px" }}>
                      <BodyCopy paragraphs={art.body} />
                    </div>
                    {!g.dimsTop && (
                      <div id="aw-measures" style={{ marginTop: scalePx(48) }}>{measures}</div>
                    )}
                  </div>
                  {g.dimsTop && (
                    <div
                      id="aw-measures"
                      className="absolute text-right"
                      dir="rtl"
                      style={{ ...column, top: scalePx(g.dimsTop) }}
                    >
                      {measures}
                    </div>
                  )}
                </React.Fragment>
              );
            })()}

            <NeighbourLink artwork={next} side="left" top={NAV_TOP} thumbH={NAV_SIZE} thumbW={NAV_WIDTH} />
            <NeighbourLink artwork={prev} side="right" top={NAV_TOP} thumbH={NAV_SIZE_RIGHT} thumbW={NAV_WIDTH} gutter={NAV_GUTTER_RIGHT} />

            {/* Both footer links are right-aligned boxes (RTL): יצירת קשר ends
                at x=112 and אודות at x=216, which is what keeps them apart. */}
            <div
              id="aw-footer-about"
              className="absolute text-right"
              dir="rtl"
              style={{
                left: scalePx(85),
                top: scalePx(FOOTER_LINKS_TOP),
                width: scalePx(131),
                fontFamily: FONT_THEBASICS,
                fontSize: scalePx(20),
                letterSpacing: "0.2px",
              }}
            >
              <NavLink label="אודות" href="about.html" />
            </div>
            <div
              id="aw-footer-contact"
              className="absolute text-right"
              dir="rtl"
              style={{
                left: scalePx(-128),
                top: scalePx(FOOTER_LINKS_TOP),
                width: scalePx(240),
                fontFamily: FONT_THEBASICS,
                fontSize: scalePx(20),
                letterSpacing: "0.2px",
              }}
            >
              <NavLink label="יצירת קשר" href="#contact" />
            </div>
            <p
              id="aw-footer-paragraph"
              className="absolute text-right"
              dir="rtl"
              style={{
                right: scalePx(23),
                top: scalePx(FOOTER_PARAGRAPH_TOP),
                width: scalePx(875),
                fontWeight: 500,
                fontSize: scalePx(20),
                lineHeight: 1.21,
                letterSpacing: "-0.02em",
              }}
            >
              <span style={{ fontFamily: FONT_MASADA }}>אוספי מוזיאון ישראל</span>
              <span style={{ fontFamily: FONT_THEBASICS }}> מונים כ-500 אלף פריטים המשתרעים על כל קשת התרבות החומרית, מהפרהיסטוריה ועד ימינו. האוסף מאורגן בשלושה אגפים מרכזיים — ארכאולוגיה, אמנות, ואמנות יהודית — וכולל את האחזקות הגדולות בעולם של ארכאולוגיה מקראית וארץ-ישראלית, לצד אמנות יפה, צילום, עיצוב, אתנוגרפיה וחפצי פולחן.</span>
            </p>
            <AnimatedFooterWordmark
              id="aw-footer-wordmark"
              style={{
                left: scalePx(24),
                top: scalePx(FOOTER_WORDMARK_TOP),
                width: scalePx(1680),
                height: scalePx(170),
              }}
            />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
