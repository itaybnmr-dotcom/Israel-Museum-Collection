<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style id="__paintgate">body{opacity:0}</style>
  <title>אוספי מוזיאון ישראל</title>
  <meta name="description" content="אסופת מעגל — יצירות מתוך אוספי מוזיאון ישראל המאורגנות סביב מוטיב העיגול." />
  <link rel="icon" type="image/svg+xml" href="public/images/favicon.svg" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <!-- Same Tailwind-CDN caveat as index.html: no custom fontFamily config here
       either — see index.html's own note for why that silently doesn't work
       for React-rendered classNames. Font is applied via inline style
       (FONT_THEBASICS) instead. -->
  <!-- Static snapshot of Tailwind's generated utility CSS, loaded as a
       real stylesheet before the CDN script below. The Play CDN script
       generates its CSS client-side by scanning the DOM after React
       mounts, which leaves a real window where elements using classes
       like "absolute" or "flex" for actual layout render unpositioned
       until it catches up — usually invisible on a fast local server,
       but visible as a broken/unstyled flash on a slower connection.
       This link tag is render-blocking (guaranteed present on first
       paint) and covers every utility class this site actually uses;
       the CDN script stays below as a safety net for anything it
       doesn't. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="artworks-data.js"></script>
  <script src="search-engine.js"></script>
  <style>
    @view-transition {
      navigation: auto;
    }
    ::view-transition-group(root) {
      animation-duration: 0.42s;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    ::view-transition-old(root),
    ::view-transition-new(root) {
      mix-blend-mode: normal;
    }
    /* The nav bar carries a persistent view-transition-name (site-header) so
       it morphs instead of cross-fading — but the browser still runs its
       default old/new fade *underneath* that morph, and since the two
       snapshots are almost-but-not-quite pixel-identical (font hinting,
       subpixel rounding) that reads as a flicker. Freezing it removes that. */
    ::view-transition-old(site-header),
    ::view-transition-new(site-header) {
      animation: none;
      mix-blend-mode: normal;
    }
    /* Also freeze the group's own position/size interpolation — otherwise
       even a 1px geometry mismatch between two pages' headers (they're
       hand-tuned per page) makes it visibly slide during the crossfade. */
    ::view-transition-group(site-header) {
      animation: none;
    }
    @font-face {
      font-family: 'TheBasics';
      src: url('public/fonts/TheBasics-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheBasics';
      src: url('public/fonts/TheBasics-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheBasics';
      src: url('public/fonts/TheBasics-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Masada';
      src: url('public/fonts/Masada-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      background-color: #fffdfa;
      color: #28282a;
      font-family: 'TheBasics', 'Segoe UI', Arial, sans-serif;
      font-weight: 500;
    }

    ::selection {
      background-color: #28282a;
      color: #fffdfa;
    }
  </style>
</head>
<body>
  <!-- Static, JS-free header: React/ReactDOM/Babel-standalone all load from a
       CDN and the whole page script has to be parsed and transpiled before
       React paints anything, so on every navigation there's a real gap where
       the document is blank and the nav bar vanishes. This markup needs no
       JS at all, so it paints on the very first frame and carries the
       site-header view-transition name itself (the React-rendered header
       below no longer claims it — a name can only be claimed by one element
       at a time). It sits one z-index below the real header and is never
       removed; once React mounts, its own header simply covers this one, so
       there's no visible swap — as long as both agree on exact geometry
       (right/top/width/height/gap below), which is why those are hardcoded
       to match every page's own HeaderWordmarkLink/TopNav values exactly
       rather than copy-pasted loosely. -->
  <div style="position:fixed;inset-inline:0;top:0;z-index:29;display:flex;justify-content:center;pointer-events:none;view-transition-name:site-header;">
    <div dir="rtl" style="position:relative;width:min(1728px,100vw);">
      <a href="index.html" style="position:absolute;right:calc(min(1728px,100vw) * 0.013889);top:calc(min(1728px,100vw) * 0.017940);width:calc(min(1728px,100vw) * 0.142940);height:calc(min(1728px,100vw) * 0.014468);pointer-events:auto;display:block;">
        <img src="public/images/wordmark.svg" alt="אוספי מוזיאון ישראל" style="width:100%;height:100%;display:block;" />
      </a>
      <nav dir="rtl" style="position:absolute;inset-inline-end:calc(min(1728px,100vw) * 0.013889);top:calc(min(1728px,100vw) * 0.018519);display:flex;align-items:center;gap:20px;pointer-events:auto;font-family:'TheBasics','Segoe UI',Arial,sans-serif;font-weight:500;font-size:calc(min(1728px,100vw) * 0.011574);letter-spacing:0.2px;">
        <a href="index.html#about" style="color:#28282a;text-decoration:none;">אסופות</a>
        <a href="collection-index.html" style="color:#28282a;text-decoration:none;">אינדקס</a>
        <a href="search.html" style="color:#28282a;text-decoration:none;">חיפוש</a>
        <a href="about.html" style="color:#28282a;text-decoration:none;">אודות</a>
      </nav>
    </div>
  </div>

  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useRef, useEffect } = React;

    const FONT_THEBASICS = "TheBasics, \"Segoe UI\", Arial, sans-serif";
    // Masada (public/fonts/Masada-Medium.otf, @font-face above) is used for
    // the footer's about-copy paragraph specifically, distinct from the
    // TheBasics webfont used everywhere else on the page.
    const FONT_MASADA = "Masada, \"Segoe UI\", Arial, sans-serif";

    // Every visit to this page lazy-loads and fades in each grid tile as it
    // scrolls into view (see Card / scheduleTileReveal) — not just the
    // first time this browser has hit the site.
    const TILE_FADE_MS = 500;

    // The big footer wordmark has two "icon slot" glyphs baked into the
    // logo artwork itself (a bowtie/triangle-pair and a square-with-lens
    // shape, between מוזיאון and ישראל) — public/images/wordmark-blank.svg
    // is the same logo with just those two shapes removed, so these can be
    // overlaid as real <img> elements and cycled instead. Coordinates below
    // are those two paths' bounding boxes in the source SVG's 1622×165
    // viewBox, converted to the footer instance's actual rendered box
    // (1679×170 — see the wordmark <img>'s own width/height) via
    // scaleX = 1679/1622, scaleY = 170/165.
    // Same 5 reels the home page's Hero randomly picks from (see index.html's
    // own HERO_VIDEOS comment for why vertical_landscape.mp4 stands in for
    // the motif's native 9:16 vertical.mp4 here — every entry is 16:9).
    const HERO_VIDEOS = [
      "public/videos/circle_1.mp4",
      "public/videos/vertical_landscape.mp4",
      "public/videos/window_1.mp4",
      "public/videos/motion.mp4",
      "public/videos/shard_1.mp4",
    ];

    const WORDMARK_HOVER_FADE_MS = 200;

    // Small header wordmark: hovering plays a random one of the home page's
    // hero reels full-screen behind it (re-picked fresh each time the hover
    // starts, like the hero re-picks on every page load) — everything else
    // on the page is covered, leaving only the wordmark itself visible on
    // top. Clicking it goes back to the home page; sessionStorage flags are
    // set first so index.html (a) skips its normal thumbnail-expand intro
    // (started/revealed in index.html's App) and instead just fades straight
    // in, and (b) has its Hero play this exact same reel (not a fresh random
    // pick) so the fade lands on matching footage instead of cutting to a
    // different one.
    function HeaderWordmarkLink({ style }) {
      const [video, setVideo] = useState(null);
      const [mounted, setMounted] = useState(false);
      const [visible, setVisible] = useState(false);
      const rafIds = useRef([]);
      const closeTimer = useRef(null);

      useEffect(() => {
        rafIds.current.forEach((id) => cancelAnimationFrame(id));
        rafIds.current = [];
        clearTimeout(closeTimer.current);
        if (video) {
          setMounted(true);
          setVisible(false);
          rafIds.current.push(requestAnimationFrame(() => {
            rafIds.current.push(requestAnimationFrame(() => setVisible(true)));
          }));
        } else if (mounted) {
          setVisible(false);
          closeTimer.current = setTimeout(() => setMounted(false), WORDMARK_HOVER_FADE_MS);
        }
        return () => {
          rafIds.current.forEach((id) => cancelAnimationFrame(id));
          rafIds.current = [];
          clearTimeout(closeTimer.current);
        };
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [video]);

      return (
        <a
          href="index.html"
          className="absolute pointer-events-auto"
          style={{ ...style, zIndex: 41 }}
          onMouseEnter={() => setVideo(HERO_VIDEOS[Math.floor(Math.random() * HERO_VIDEOS.length)])}
          onMouseLeave={() => setVideo(null)}
          onClick={() => {
            if (video) sessionStorage.setItem("heroVideo", video);
          }}
        >
          <img src="public/images/wordmark.svg" alt="אוספי מוזיאון ישראל" style={{ width: "100%", height: "100%", display: "block", position: "relative", zIndex: 2 }} />
          {mounted && (
            <div
              className="fixed inset-0 overflow-hidden pointer-events-none"
              style={{ zIndex: 1, opacity: visible ? 1 : 0, transition: `opacity ${WORDMARK_HOVER_FADE_MS}ms ease` }}
            >
              <video key={video} src={video} autoPlay loop muted playsInline className="w-full h-full object-cover" />
            </div>
          )}
        </a>
      );
    }

    const WORDMARK_ICONS = [
      "public/images/icon-circle.svg",
      "public/images/icon-verticality.svg",
      "public/images/icon-gate.svg",
      "public/images/icon-motion.svg",
      "public/images/icon-fragment.svg",
    ];
    const WORDMARK_ICON_SLOTS = [
      { left: 1135.5, top: 30.3, width: 122.4, height: 118.9 }, // bowtie/triangle-pair slot
      { left: 475.3, top: 30.3, width: 117.4, height: 118.9 }, // square/lens slot
    ];
    // Fast, hard cut — no fade — matching the reference's rapid flicker
    // between icons (a new one every ~300ms with no crossfade at all).
    const WORDMARK_ICON_INTERVAL_MS = 200;

    function CyclingIcon({ src, style }) {
      return <img src={src} alt="" aria-hidden="true" style={{ ...style, objectFit: "contain" }} />;
    }

    function AnimatedFooterWordmark({ style, id }) {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setTick((t) => t + 1), WORDMARK_ICON_INTERVAL_MS);
        return () => clearInterval(id);
      }, []);
      return (
        <div id={id} className="absolute" style={{ ...style, position: "absolute" }}>
          <img src="public/images/wordmark-blank.svg" alt="אוספי מוזיאון ישראל" style={{ width: "100%", height: "100%" }} />
          {WORDMARK_ICON_SLOTS.map((slot, i) => (
            <CyclingIcon
              key={i}
              src={WORDMARK_ICONS[(tick + i * 2) % WORDMARK_ICONS.length]}
              style={{ position: "absolute", left: scalePx(slot.left), top: scalePx(slot.top), width: scalePx(slot.width), height: scalePx(slot.height) }}
            />
          ))}
        </div>
      );
    }

    const UNDERLINE_OFFSET = "0.08em";
    const UNDERLINE_THICKNESS = "0.1em";

    // Same width-relative scaling system as index.html — this page is built
    // from the same 1728px-wide Figma frame, so reusing it keeps this page
    // scaling consistently with the rest of the site.
    const FRAME_W = 1728;
    const scalePx = (px) => `calc(min(${FRAME_W}px, 100vw) * ${(px / FRAME_W).toFixed(6)})`;
    const CANVAS_W = "w-[1728px] max-w-full";

    // Plain nav links (no "אסופות" — that one's rendered separately, always
    // underlined, since it's this page's own current section).
    const NAV_ITEMS = [
      { label: "אינדקס", href: "collection-index.html" },
      { label: "חיפוש", href: "#search" },
      { label: "אודות", href: "about.html" },
    ];

    // The other 4 motif tags link back to the home page's paragraph, where
    // hovering each still opens its own video preview — this page only
    // exists for מעגל so far, the other 4 don't have collection pages yet.
    const MOTIF_TAGS = [
      { label: "מעגל", current: true },
      { label: "אנכיות", href: "collection-verticality.html" },
      { label: "שער", href: "collection-gate.html" },
      { label: "תנועה", href: "collection-motion.html" },
      { label: "שבר", href: "collection-shard.html" },
    ];

    // Hardcoded row breaks (not natural CSS wrap) so the layout matches the
    // reference exactly regardless of font metrics/viewport.
    const FILTER_ROWS = [
      ["אדום", "כחול", "ירוק", "זהב"],
      ["שחור", "לבן", "אבן", "זכוכית"],
      ["מתכת", "עץ", "בד וטקסטיל"],
      ["קרמיקה", "צבעי־שמן"],
    ];

    // Only "אדום" is wired to an actual filtered result so far — the other
    // filter words render (per FILTER_ROWS above) but don't do anything yet.
    // Two separate interactions layer on top of each other:
    //  - HOVERING "אדום" is just a transient preview: its 7 matches pull
    //    into a loose cluster at the center of the viewport (Card's
    //    hoverMagnetTransform below) while everything else dims, and it all
    //    snaps back the instant the mouse leaves.
    //  - CLICKING it commits: the 7 matches fly from wherever they normally
    //    sit to this fixed arrangement (RED_FILTER_LAYOUT), exact boxes
    //    lifted from the dedicated Figma frame for this state ("סינון מעגל
    //    + אדום", node 1230:1326) rather than derived from the normal
    //    grid's own per-card x/y/w/h — that frame lays these 7 out
    //    completely differently (bigger, cover-cropped instead of
    //    contain-fit) from how they sit in the default collage, so the two
    //    can't share one set of boxes. Every other card fades out. ניקוי
    //    reverses it — everything flies/fades back.
    // silver-hoard-bead is the one exception to the cover-crop swap: its
    // box there is pixel-identical (790×953) to its normal-grid box, just
    // moved, so it just slides via the plain Card component (position
    // override only) instead of RedFilterCard below — that keeps its
    // natural (non-cropped) image placement, its caption-inside-the-box
    // layout, and its hover/typewriter behavior all working unmodified.
    const FILTER_MATCHES = {
      "אדום": [
        "silver-hoard-bead",
        "sun-croton",
        "red-sun",
        "athena-engraving",
        "pastilli-chair",
        "jericho-first",
        "beheaded-sun",
      ],
      "אבן": ["silver-hoard-bead", "athena-engraving", "negev"],
      // Below: populated the same way as אדום/אבן (real per-image visual
      // inspection, no forced matches) but without a Figma-matched commit
      // layout — these only drive the hover-magnet preview (see FilterMenu/
      // Card), not COMMITTABLE_FILTERS, so clicking them does nothing yet.
      "כחול": ["air-iron-water", "suppression", "sunset-arenys"],
      "ירוק": ["engraved-plate", "siren-mirror", "launch", "suppression", "even-more"],
      "זהב": ["quipu", "pomegranate-bottle", "seder-plate", "negev", "annunciation", "sunset-arenys"],
      "שחור": ["bicycle-wheel", "paris-graffiti", "stalactite", "titus-denarius", "spindle-whorl", "optical-parable", "launch"],
      "לבן": ["bicycle-wheel"],
      // "זכוכית" (glass): no artwork in this collection is actually glass —
      // left unset rather than forced, so the word stays inert (matches the
      // "show nothing if nothing fits" rule).
      "מתכת": ["sun-croton", "siren-mirror", "titus-denarius", "torah-crown", "bicycle-wheel", "silver-hoard-ring", "engraved-plate"],
      "עץ": ["bicycle-wheel"],
      "בד וטקסטיל": ["quipu"],
      "קרמיקה": ["seder-plate", "pomegranate-bottle"],
      "צבעי־שמן": ["air-iron-water", "suppression", "annunciation", "sunset-arenys", "even-more", "red-sun"],
    };
    const MAGNET_SCALE = 1.4;
    const MAGNET_CLUSTER_RADIUS = 70;
    // x:3 puts the bead's left edge on the same vertical line as the
    // "אודות" nav item (which sits at code x=24, and the bead image has a
    // 21px pad inside its box → card x 3 + 21 = 24). Caption spans the full
    // raw photo width (no insets) — per reference, "the artwork's edge" for
    // this piece means the photo's own edge, not the donut's real (much
    // narrower) silhouette inside it.
    const RED_FILTER_BEAD_POS = { x: 3, y: 434 };
    const RED_FILTER_LAYOUT = [
      // x is 681, not 723 (flush with sun-croton's box) — img10.png bakes in
      // a wide white-mat margin before its black frame starts (~19.4% of the
      // photo's own width), so a box-edge match left the frame visibly
      // adrift to the right of where sun-croton's photo becomes visible past
      // the bead. 681 gives the frame the same small breathing gap past the
      // bead's own right edge (772) that sun-croton's photo has before its
      // own content reads as visibly distinct. capInsetR/L (~19.4% of the
      // 504-wide box, matching img10.png's own real left/right frame
      // fraction) pull the caption in from the box's raw edges to the
      // painting's actual framed edges — the wide white mat around it means
      // "the artwork's edge" here is the frame, not the photo's own bounds.
      { id: "red-sun", x: 681, y: 905, w: 504, h: 387, capInsetR: 98, capInsetL: 98 },
      { id: "sun-croton", x: 723, y: 444, w: 624, h: 430, capInsetR: 57, capInsetL: 61 },
      // capInsetR/L pull the caption in to the diagonal-cut black square's
      // real edges (CONTENT_FRAC["img8.png"] = [0.200, 0.797], already
      // measured for the normal grid and confirmed against the raw file —
      // converted into this 422-wide box).
      { id: "athena-engraving", x: -61, y: 1387, w: 422, h: 325, capInsetR: 86, capInsetL: 84 },
      // capDY pulls the caption up — img4.png has a lot of empty studio
      // floor/shadow below the chair itself, and since its aspect ratio is
      // a near-exact match for this box's, object-fit:cover shows nearly
      // the whole photo (floor included) instead of cropping it away.
      // descOffsetY: this box (881 tall) is much taller than the card's
      // normal-grid box (~539 rendered image height) that the description's
      // small fixed +12 offset was tuned against — the SAME 12px reads as a
      // much smaller fraction of this bigger box, leaving a bigger blank gap
      // above the chair. 8 keeps the offset-to-box-height ratio the same as
      // the normal grid (12/539 ≈ 8/881) rather than closing the gap outright.
      { id: "pastilli-chair", x: 410, y: 1387, w: 1147, h: 881, capDY: -9, descOffsetY: 8 },
      // capDY: -253 reuses the same offset already measured for this image
      // in the normal grid (CARDS_BY_ID's own jericho-first entry) — img7.png
      // has a lot of empty white space above/below the mosaic itself, and
      // since the box's aspect nearly matches the photo's, cover-fit shows
      // that whitespace instead of cropping it away.
      { id: "jericho-first", x: 597, y: 2025, w: 1106, h: 850, capDY: -266 },
      // capDY pulls the caption up — img9.png has a thin sliver of white
      // margin below the mosaic itself (content runs to ~95% of the photo's
      // own height).
      { id: "beheaded-sun", x: 595, y: 2615, w: 548, h: 421, capDY: -20 },
    ];
    const RED_FILTER_BY_ID = Object.fromEntries(RED_FILTER_LAYOUT.map((l) => [l.id, l]));
    // The filtered result is a much shorter page than the full collage (just
    // these 7 pieces + footer), so it gets its own canvas height and footer
    // offsets — lifted directly from the same Figma frame — rather than the
    // normal grid's LAST_CARD_BOTTOM-derived ones further down.
    const RED_FILTER_CANVAS_H = 3693;
    const RED_FILTER_FOOTER_LINKS_TOP = 3428;
    // Same -48 relationship as the normal page's FOOTER_PARAGRAPH_TOP (see
    // below), so the paragraph's last line lines up with the אודות / יצירת
    // קשר row instead of sitting further above it.
    const RED_FILTER_FOOTER_PARAGRAPH_TOP = RED_FILTER_FOOTER_LINKS_TOP - 48;
    const RED_FILTER_FOOTER_WORDMARK_TOP = 3502;
    const RED_FILTER_FLY_MS = 480;

    // Same idea as RED_FILTER_* above, but for "אבן" (stone) — only 2 of its
    // matches (silver-hoard-bead, athena-engraving are both carnelian/stone
    // pieces) get a committed result view; the bead again just slides via
    // Card + posOverride (same pixel-identical 790×953 box, same "x:3 lines
    // up with אודות" logic as RED_FILTER_BEAD_POS — it's the same photo).
    // athena-engraving gets its own cover-cropped RedFilterCard box, but a
    // portrait one this time (this frame shows the gem's own black square
    // frame edge-to-edge, unlike אדום's wider, landscape cover-crop of the
    // same image) — initial estimate from the reference frame, refine
    // against a live screenshot.
    // y:434 — same first-row clearance as RED_FILTER's own first row (see
    // sun-croton above), so the "מעגל המעגל הוא..." description paragraph
    // (fixed at y:183, ~72 tall) has room to sit above both boxes instead
    // of colliding with them.
    const STONE_FILTER_BEAD_POS = { x: 3, y: 434 };
    // fullBleed: true — unlike the RED_FILTER box (a landscape cover-crop
    // that shows most of img8.png's own white mat, hence CONTENT_FRAC there
    // being real signal), this portrait box crops so tight against the
    // *landscape* source photo that the black gem frame fills it edge to
    // edge with no mat left to exclude — CONTENT_FRAC's fractions (measured
    // against the photo's own near-full-width Card rendering) don't apply
    // to a crop this different, so the description overlay should just use
    // the box's own full bounds as "real content" instead.
    // x:780 — the same ~8px breathing gap the normal grid itself already
    // has between air-iron-water and bicycle-wheel (a real-content-edge gap:
    // air-iron-water's own rendered right edge at 843, bicycle-wheel's
    // real content starting at offsetX + 0.195*iw ≈ 852 past its box's raw
    // left of 772 — matching CONTENT_FRAC["img21.png"]). Bead's own real
    // right edge here is 772 (its 790-wide box centers a narrower
    // letterboxed 748.7-wide render — see RED_FILTER_LAYOUT's own "bead's
    // own right edge (772)" comment), so 772 + 8 = 780.
    const STONE_FILTER_LAYOUT = [{ id: "athena-engraving", x: 780, y: 434, w: 264, h: 335, fullBleed: true }];
    const STONE_FILTER_BY_ID = Object.fromEntries(STONE_FILTER_LAYOUT.map((l) => [l.id, l]));
    // Only 2 pieces + footer — a much shorter canvas than even RED_FILTER's,
    // sized off the bead's own box (the taller of the two) plus the same
    // footer clearance pattern used elsewhere.
    const STONE_FILTER_CANVAS_H = 1812;
    const STONE_FILTER_FOOTER_LINKS_TOP = 1527;

        // never left — without this guard that replays the whole closed-
        // then-sweep-in animation as a visible glitch right at the click.
        if (visible) return;
        clearRafs();
        setOrigin("right");
        setVisible(false);
        setResetKey((k) => k + 1);
        rafIds.current.push(requestAnimationFrame(() => {
          rafIds.current.push(requestAnimationFrame(() => setVisible(true)));
        }));
      }
      function handleLeave() {
        clearRafs();
        setOrigin("left");
        setVisible(false);
      }

          onClick={onClick}
          onMouseEnter={handleEnter}
          onMouseLeave={handleLeave}

    // Card's own hover state) rather than this span's own mouse events —
    // used so hovering an artwork's image also sweeps its caption's
    // underline, as one combined "hovering this piece" interaction, rather
    // than requiring the user to separately hover the small caption text.
    function HoverWord({ label, onClick, active, onHoverChange }) {
      const [visible, setVisible] = useState(false);
      const [origin, setOrigin] = useState("right");
      const [resetKey, setResetKey] = useState(0);
      const rafIds = useRef([]);
      const isControlled = active !== undefined;

      function clearRafs() {
        rafIds.current.forEach((id) => cancelAnimationFrame(id));
        rafIds.current = [];
      }
      function open() {
        clearRafs();
        setOrigin("right");
        setVisible(false);
        setResetKey((k) => k + 1);
        rafIds.current.push(requestAnimationFrame(() => {
          rafIds.current.push(requestAnimationFrame(() => setVisible(true)));
        }));
        onHoverChange && onHoverChange(true);
      }
      function close() {
        clearRafs();
        setOrigin("left");
        setVisible(false);
        onHoverChange && onHoverChange(false);
      }

      useEffect(() => {
        if (!isControlled) return;
        if (active) open(); else close();
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [isControlled, active]);

      const clipPath = visible ? "inset(0 0 0 0)" : origin === "right" ? "inset(0 0 0 100%)" : "inset(0 100% 0 0)";

      return (
        <span
          onMouseEnter={isControlled ? undefined : open}
          onMouseLeave={isControlled ? undefined : close}
          onFocus={isControlled ? undefined : open}
          onBlur={isControlled ? undefined : close}
          onClick={onClick}
          tabIndex={isControlled ? undefined : 0}
          className={"relative inline-block text-[#28282a]" + (isControlled ? "" : " cursor-pointer")}
        >
          {label}
          <span
            key={resetKey}
            aria-hidden="true"
            className="absolute inset-0 pointer-events-none"
            style={{
              color: "transparent",
              textDecorationLine: "underline",
              textDecorationColor: "#28282a",
              textDecorationThickness: UNDERLINE_THICKNESS,
              textUnderlineOffset: UNDERLINE_OFFSET,
              textDecorationSkipInk: "auto",
              clipPath,
              transition: "clip-path 0.16s ease",
            }}
          >
            {label}
          </span>
        </span>
      );
    }

    function TopNav({ onSearchToggle }) {

              אינדקס/חיפוש/אודות which are plain sibling links) — but still a
              real link to the home page's About section, same target
              אודות itself points to, not just a static label. Sets the same
              skipIntro/scrollToAbout handoff as the wordmark's own link

    }

    const SEARCH_FADE_MS = 180;
    const SEARCH_PLACEHOLDER = "חפש.י לפי אסופה, יצירה או יוצר.ת...";
    const SEARCH_MAX_RESULTS = 8;
    const CARET_BLINK_MS = 530;

    // page (search.html) can never disagree about what a query means. It
    // returns the complete list; the dropdown shows the first
    // SEARCH_MAX_RESULTS and links the rest through to search.html.
    function searchArtworks(query) {
      return window.MuseumSearch.run(query).results;

    function SearchBar({ open, onClose }) {
      const [mounted, setMounted] = useState(false);
      const [visible, setVisible] = useState(false);
      const [query, setQuery] = useState("");
      const rafIds = useRef([]);
      const closeTimer = useRef(null);
      const wrapperRef = useRef(null);
      const inputRef = useRef(null);
      const allResults = searchArtworks(query);
      const results = allResults.slice(0, SEARCH_MAX_RESULTS);

      function goToResult(art) {

      // Fake caret matching the stroke's own weight (scalePx(4)) — the real
      // <input> keeps native focus/selection/typing, but its own caret is
      // hidden (caret-color: transparent) since browsers don't expose a way
      // to make that thin native bar match our 4px line. This bar is
      // repositioned by measuring the pre-cursor substring on a scratch
      // canvas (matching the input's own live computed font), same
      // measure-in-browser technique used throughout this file for text
      // fitting — cheap enough to run on every keystroke.
      const [caretOffset, setCaretOffset] = useState(0);
      const [caretOn, setCaretOn] = useState(true);
      const [caretFocused, setCaretFocused] = useState(false);
      const measureCtxRef = useRef(null);
      const blinkTimerRef = useRef(null);

      function measureCaret() {
        const el = inputRef.current;
        if (!el) return;
        if (!measureCtxRef.current) measureCtxRef.current = document.createElement("canvas").getContext("2d");
        const cs = getComputedStyle(el);
        measureCtxRef.current.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        const pos = el.selectionStart == null ? el.value.length : el.selectionStart;
        setCaretOffset(measureCtxRef.current.measureText(el.value.slice(0, pos)).width);
      }

      function restartBlink() {
        setCaretOn(true);
        clearInterval(blinkTimerRef.current);
        blinkTimerRef.current = setInterval(() => setCaretOn((v) => !v), CARET_BLINK_MS);
      }

      useEffect(() => {
        if (!caretFocused) { clearInterval(blinkTimerRef.current); return; }
        restartBlink();
        return () => clearInterval(blinkTimerRef.current);
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [caretFocused]);

      useEffect(() => {
        rafIds.current.forEach((id) => cancelAnimationFrame(id));
        rafIds.current = [];
        clearTimeout(closeTimer.current);
        if (open) {
          setMounted(true);
          setVisible(false);
          rafIds.current.push(requestAnimationFrame(() => {
            rafIds.current.push(requestAnimationFrame(() => setVisible(true)));
          }));
        } else if (mounted) {
          setVisible(false);
          setQuery("");
          if (inputRef.current) inputRef.current.value = "";
          closeTimer.current = setTimeout(() => setMounted(false), SEARCH_FADE_MS);
        }
        return () => {
          rafIds.current.forEach((id) => cancelAnimationFrame(id));
          rafIds.current = [];
          clearTimeout(closeTimer.current);
        };
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [open]);

      useEffect(() => {
        if (open && visible && inputRef.current) inputRef.current.focus();
      }, [open, visible]);

      // Click-away and Escape both close it. This listens on "click" (not
      // "mousedown") specifically so the toggle's own stopPropagation — fired
      // during the same click event — can suppress it; a mousedown listener
      // would fire on a different, earlier event and miss that suppression.
      useEffect(() => {
        if (!open) return;
        function onDocClick(e) {
          if (wrapperRef.current && !wrapperRef.current.contains(e.target)) onClose();
        }
        function onKeyDown(e) {
          if (e.key === "Escape") onClose();
          if (e.key === "Enter") {
            // Enter goes to the full results list rather than jumping straight
            // into the top hit — a query like "אדום" has 27 matches and the
            // dropdown only ever shows 8 of them.
            window.location.href = window.MuseumSearch.urlFor(inputRef.current ? inputRef.current.value : "");
          }
        }
        document.addEventListener("click", onDocClick);
        document.addEventListener("keydown", onKeyDown);
        return () => {
          document.removeEventListener("click", onDocClick);
          document.removeEventListener("keydown", onKeyDown);
        };
      }, [open, onClose]);

      if (!mounted) return null;

      return (
        <div
          ref={wrapperRef}
          className="absolute pointer-events-auto"
          style={{
            left: 0,
            right: 0,
            top: scalePx(0),
            height: scalePx(70),
            zIndex: 50,
            backgroundColor: "#fffdfa",
            opacity: visible ? 1 : 0,
            transition: `opacity ${SEARCH_FADE_MS}ms ease`,
          }}
        >
          <div
            className="absolute"
            style={{ left: 0, right: 0, top: scalePx(66), borderBottom: `${scalePx(4)} solid #28282a` }}
          />
          <input
            ref={inputRef}
            type="text"
            dir="rtl"
            placeholder={SEARCH_PLACEHOLDER}
            className="absolute bg-transparent outline-none text-right placeholder:text-[#28282a]"
            style={{
              right: scalePx(15),
              left: scalePx(15),
              top: scalePx(10),
              height: scalePx(56),
              fontFamily: FONT_THEBASICS,
              fontWeight: 500,
              fontSize: scalePx(58),
              lineHeight: 1.21,
              color: "#28282a",
              caretColor: "transparent",
            }}
            onFocus={() => { setCaretFocused(true); setQuery(inputRef.current.value); measureCaret(); restartBlink(); }}
            onBlur={() => setCaretFocused(false)}
            onInput={(e) => { setQuery(e.target.value); measureCaret(); restartBlink(); }}
            onKeyUp={() => { measureCaret(); restartBlink(); }}
            onClick={() => { measureCaret(); restartBlink(); }}
          />
          {caretFocused && query && (
            <div
              className="absolute pointer-events-none"
              style={{
                right: `calc(${scalePx(15)} + ${caretOffset}px)`,
                top: scalePx(8),
                height: scalePx(48),
                width: scalePx(4),
                backgroundColor: "#28282a",
                opacity: caretOn ? 1 : 0,
              }}
            />
          )}
          {query.trim() && (
            <div
              className="absolute"
              style={{
                left: 0,
                right: 0,
                top: scalePx(70),
                backgroundColor: "#fffdfa",
              }}
            >
              {results.length === 0 ? (
                <div
                  dir="rtl"
                  className="text-right"
                  style={{
                    padding: `${scalePx(18)} ${scalePx(15)}`,
                    fontFamily: FONT_THEBASICS,
                    fontSize: scalePx(20),
                    color: "rgba(40, 40, 42, 0.6)",
                  }}
                >
                  אין תוצאות
                </div>
              ) : (

                  <div
                    key={art.id}
                    dir="rtl"
                    onClick={() => goToResult(art)}
                    className="flex items-baseline justify-between cursor-pointer"
                    style={{
                      padding: `${scalePx(14)} ${scalePx(15)}`,
                      borderBottom: (i < results.length - 1 || allResults.length > results.length) ? "1px solid rgba(40, 40, 42, 0.2)" : "none",
                      fontFamily: FONT_THEBASICS,

                  >
                    <span style={{ fontWeight: 500, fontSize: scalePx(22) }}>
                      {art.title}
                      {art.artist && (

              {allResults.length > results.length && (
                <div
                  dir="rtl"
                  onClick={() => { window.location.href = window.MuseumSearch.urlFor(query); }}
                  className="text-right cursor-pointer"
                  style={{
                    padding: `${scalePx(14)} ${scalePx(15)}`,
                    fontFamily: FONT_THEBASICS,
                    fontSize: scalePx(20),
                    color: "rgba(40, 40, 42, 0.6)",
                  }}
                >
                  {`כל התוצאות (${allResults.length})`}
                </div>

            </div>
          )}
        </div>
      );
    }

    function MotifTagRow() {
      return (
        <div
          id="cc-motif-row"
          className="flex items-baseline gap-3"
          dir="rtl"
          style={{ fontFamily: FONT_THEBASICS, fontSize: scalePx(40), letterSpacing: "-0.8px" }}
        >
          {MOTIF_TAGS.map((tag, i) => {
            const text = i < MOTIF_TAGS.length - 1 ? tag.label + "," : tag.label;
            return tag.current ? (
              <span
                key={tag.label}
                style={{
                  textDecorationLine: "underline",
                  textDecorationColor: "#28282a",

    // The color/material filter. In the reference flow it rests as just the
    // small ring icon pinned near the top-right (below the small wordmark);
    // clicking the icon opens the "סינון מעגל" state from the Figma frame —
    // the floating word list (40px, no panel/background, right-aligned) with
    // the icon inline at the start of the first line and ניקוי (reset)
    // below. The design's own mega-menu export positioned every word via
    // huge (800%+) inset percentages off the tiny 43x42 icon — a Figma-
    // authoring artifact, not real geometry — so this reproduces the
    // visible result cleanly instead.
    const FILTER_FADE_MS = 120;

    // Filter words that commit to a fixed result layout on click (see
    // RED_FILTER_LAYOUT / STONE_FILTER_LAYOUT) rather than just previewing
    // on hover — every other FILTER_MATCHES entry (if any) still gets the
    // hover-magnet preview for free, it just has nothing to click into yet.
    const COMMITTABLE_FILTERS = ["אדום", "אבן"];

    function FilterMenu({ highlightedFilters, onFilterHover, onSelectFilter, onClear }) {
      // "open" reflects intent (icon click), "mounted" keeps the list in the
      // DOM through the fade-*out* too — it only unmounts after the opacity
      // transition finishes, instead of vanishing instantly. Starts already
      // open/mounted/visible — the filter list defaults to its open state
      // on load rather than starting collapsed behind the icon.
      const [open, setOpen] = useState(true);
      const [mounted, setMounted] = useState(true);
      const [visible, setVisible] = useState(true);
      const rafIds = useRef([]);
      const closeTimer = useRef(null);

      useEffect(() => {
        rafIds.current.forEach((id) => cancelAnimationFrame(id));
        rafIds.current = [];
        clearTimeout(closeTimer.current);
        if (open) {
          setMounted(true);
          setVisible(false);
          rafIds.current.push(requestAnimationFrame(() => {
            rafIds.current.push(requestAnimationFrame(() => setVisible(true)));
          }));
        } else if (mounted) {
          setVisible(false);
          closeTimer.current = setTimeout(() => setMounted(false), FILTER_FADE_MS);
          // Closing the menu mid-hover would otherwise leave the cards
          // stuck in the preview cluster, since the word (and its
          // onMouseLeave) is about to be removed from the DOM out from
          // under the cursor.
          onFilterHover && onFilterHover(null);
        }
        return () => {
          rafIds.current.forEach((id) => cancelAnimationFrame(id));
          rafIds.current = [];
          clearTimeout(closeTimer.current);
        };
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [open]);
