        return (
          <img
            src="public/images/icon-filter-circle.svg"
            alt="סינון"
            role="button"
            aria-expanded={open}
            className="cursor-pointer pointer-events-auto"
            onClick={() => setOpen(true)}
            style={{ width: scalePx(43), height: scalePx(42) }}
          />
        );
      }
      return (
        <div id="cc-filter-menu" className="pointer-events-auto" style={{ position: "relative", width: scalePx(600) }}>
          {/* The icon sits outside the fading block and never itself
              fades — only the word list should animate in/out. It's
              absolutely positioned (top:0, matching the closed icon's own
              box) rather than inline-aligned within row 1's text, since
              inline vertical-align is relative to the *whole line box*
              (built from the 40px text + line-height), which sat the icon
              noticeably lower than its closed-state position. Physical
              "right" here, not insetInlineEnd — in this dir="rtl" context
              inline-end resolves to the physical *left*, which put the icon
              on the wrong side entirely. */}
          <img
            src="public/images/icon-filter-circle.svg"
            alt="סינון"
            role="button"
            aria-expanded={open}
            className="cursor-pointer"
            onClick={() => setOpen(false)}
            style={{ position: "absolute", top: 0, right: 0, width: scalePx(43), height: scalePx(42) }}
          />
          <div
            className="text-right"
            dir="rtl"
            style={{
              fontFamily: FONT_THEBASICS,
              fontSize: scalePx(40),
              lineHeight: 1.15,
              opacity: visible ? 1 : 0,
              transition: `opacity ${FILTER_FADE_MS}ms ease`,
            }}
          >
            {/* Plain RTL inline text flow, not flexbox: bidi text layout
                (first logical child lands at the right, flowing left) is
                universally consistent across browsers, whereas relying on
                flex-direction's interaction with an *inherited* dir/direction
                turned out not to render the same way in every browser. */}
            {FILTER_ROWS.map((row, ri) => (
              <div key={ri} style={ri === 0 ? { paddingRight: scalePx(59) } : undefined}>
                {row.map((opt, i) => (
                  <React.Fragment key={opt}>
                    {/* A committed filter word, once selected, reads as the
                        page's current filter the same way "אסופות"/"מעגל"
                        read as the current nav/motif elsewhere — a plain
                        permanent underline, not the interactive hover-sweep
                        every other word still gets. */}
                    {highlightedFilters.includes(opt) ? (
                      <span
                        style={{
                          textDecorationLine: "underline",
                          textDecorationColor: "#28282a",
                          textDecorationThickness: UNDERLINE_THICKNESS,
                          textUnderlineOffset: UNDERLINE_OFFSET,
                          textDecorationSkipInk: "auto",
                        }}
                      >
                        {opt}
                      </span>
                    ) : (
                      <HoverWord
                        label={opt}
                        onClick={COMMITTABLE_FILTERS.includes(opt) ? () => onSelectFilter(opt) : undefined}
                        onHoverChange={
                          FILTER_MATCHES[opt] && onFilterHover ? (h) => onFilterHover(h ? opt : null) : undefined
                        }
                      />
                    )}
                    {i < row.length - 1 && (
                      <span style={{ marginInline: scalePx(10) }}>/</span>
                    )}
                  </React.Fragment>
                ))}
              </div>
            ))}
            <div style={{ marginTop: scalePx(70) }}>
              <HoverWord
                label="ניקוי"
                onClick={() => {
                  onFilterHover && onFilterHover(null);
                  onClear && onClear();
                }}
              />
            </div>
          </div>
        </div>
      );
    }

    // Hover (dim siblings, underline caption, swap image, reveal a longer
    // blurb on 3 cards) is disabled for now, per direct instruction — this
    // renders every card in its plain resting state only. Re-wiring that
    // interaction later just means bringing hoveredId/setHoveredId back as
    // props here, the way the previous version had them.
    // Coordinates the tile reveal across every Card: one shared
    // IntersectionObserver watches all card wrappers, and whichever ones
    // cross into view together in the same browser callback batch get
    // staggered TILE_STAGGER_MS apart, right-to-left (highest x — physical
    // "left" position, which is never flipped by dir=rtl — goes first) —
    // rather than each card fading in independently whenever its own image
    // happens to finish loading. tileRevealClock is a running "last
    // scheduled slot" timestamp so a later, separate scroll event starts
    // its own fresh cadence instead of queuing behind a stale one.
    //
    // TILE_TRIGGER_FRAC (0.2, matching the observer's -20% rootMargin below)
    // is also used by a plain scroll-event backstop: a big single-frame
    // scroll jump (End key, fast fling, or a script-triggered scrollTo) can
    // move an element from below the trigger line to above the viewport
    // entirely between two observer samples, skipping the "isIntersecting"
    // state altogether — IntersectionObserver simply never calls back for a
    // target that never crossed its threshold. The rAF-throttled scroll
    // listener directly measures every still-pending tile's own
    // getBoundingClientRect() on real scroll, so nothing can get stuck
    // invisible forever even if the observer alone missed it.
    const TILE_STAGGER_MS = 50;
    const TILE_TRIGGER_FRAC = 0.2;
    let tileRevealObserver = null;
    let tileRevealClock = 0;
    const tileRevealCallbacks = new Map();
    let scrollListenerAttached = false;
    let scrollCheckQueued = false;

    function revealTiles(els) {
      els.sort((a, b) => Number(b.dataset.tileX) - Number(a.dataset.tileX));
      els.forEach((el) => {
        tileRevealObserver.unobserve(el);
        const cb = tileRevealCallbacks.get(el);
        if (!cb) return;
        tileRevealCallbacks.delete(el);
        const now = Date.now();
        const at = Math.max(now, tileRevealClock + TILE_STAGGER_MS);
        tileRevealClock = at;
        setTimeout(cb, at - now);
      });
    }

    function checkPendingTiles() {
      scrollCheckQueued = false;
      const triggerLine = window.innerHeight * (1 - TILE_TRIGGER_FRAC);
      const ready = [];
      tileRevealCallbacks.forEach((_, el) => {
        const rect = el.getBoundingClientRect();
        if (rect.top < triggerLine || rect.bottom < 0) ready.push(el);
      });
      if (ready.length) revealTiles(ready);
    }

    function ensureTileScrollBackstop() {
      if (scrollListenerAttached) return;
      scrollListenerAttached = true;
      window.addEventListener(
        "scroll",
        () => {
          if (scrollCheckQueued) return;
          scrollCheckQueued = true;
          requestAnimationFrame(checkPendingTiles);
        },
        { passive: true }
      );
    }

    function scheduleTileReveal(el, onReveal) {
      ensureTileScrollBackstop();
      if (!tileRevealObserver) {
        tileRevealObserver = new IntersectionObserver(
          (entries) => {
            const entering = entries.filter((e) => e.isIntersecting).map((e) => e.target);
            if (entering.length) revealTiles(entering);
          },
          // A row must scroll up past this point (not just barely clip the
          // viewport's bottom pixel) before it triggers — a deliberate
          // "you've reached it" point partway up the screen, rather than an
          // instant tick the moment 1px shows.
          { rootMargin: `0px 0px -${TILE_TRIGGER_FRAC * 100}% 0px`, threshold: 0 }
        );
      }
      tileRevealCallbacks.set(el, onReveal);
      tileRevealObserver.observe(el);
    }

    const HOVER_OPACITY = 0.41;
    const HOVER_OPACITY_MS = 50;
    const TYPEWRITER_CHAR_MS = 4;

    function Card({ card, hoverFilter, activeFilter, hoverMagnetSuppressed, posOverride }) {
      const { iw, ih, offsetX, captionTop } = computeImage(card);
      // Every visit: starts hidden/unloaded and only fades in once this
      // card's wrapper has scrolled up to the observer's trigger point
      // (see scheduleTileReveal) AND its image has finished loading.
      const [loaded, setLoaded] = useState(false);
      // Separate from `loaded` (image fetch done): this tracks whether it's
      // this card's "turn" in the right-to-left, 50ms-apart reveal order —
      // the image only actually fades in once both are true.
      const [revealed, setRevealed] = useState(false);
      // Hovering the piece dims it to HOVER_OPACITY. `settled` flips true
      // TILE_FADE_MS after the reveal fires — before that, further opacity
      // changes still use the slow reveal duration; after it, hover
      // toggling uses the fast HOVER_OPACITY_MS instead, so the two
      // transitions never fight over the same CSS property with two
      // different speeds at once. This is a plain timer (not
      // onTransitionEnd) deliberately: hovering mid-reveal would redirect
      // the in-flight opacity transition before it ever reached its end
      // value, so "transitionend" would never fire and settled would get
      // stuck false — a real bug that made hovering a just-revealed tile
      // feel slow/broken (still animating at 500ms instead of 50ms).
      const [hovered, setHovered] = useState(false);
      const [settled, setSettled] = useState(false);
      const wrapperRef = useRef(null);

      useEffect(() => {
        const el = wrapperRef.current;
        if (!el) return;
        scheduleTileReveal(el, () => setRevealed(true));
      }, []);

      // Hover "magnet" preview: while a matched color/material word is
      // hovered (see FILTER_MATCHES) — and only when the *deepest* available
      // committed result isn't already showing — this card's own matches
      // pull into a loose cluster at the center of the current viewport and
      // grow, while every other card on the page dims. Purely transient: it
      // snaps back (magnetTransform → null → transform: none) the instant
      // the mouse leaves, unlike the click-committed fly-to-RED_FILTER_LAYOUT
      // animation below, which persists until ניקוי. Gating on
      // hoverMagnetSuppressed rather than activeFilter directly is what
      // lets this still preview a *further* narrowing (e.g. hovering "אבן"
      // while "אדום" is already committed) instead of only ever working
      // from the untouched grid — see App's own comment on
      // colorFilter/materialFilter.
      const hoverFilterGroup = FILTER_MATCHES[hoverFilter];
      const isHoverMagnetTarget = !hoverMagnetSuppressed && !!hoverFilterGroup && hoverFilterGroup.includes(card.id);
      const hoverFilterDimmed = !hoverMagnetSuppressed && !!hoverFilter && !isHoverMagnetTarget;
      // Once ANY filter is committed (click, not just hover), every card's
      // normal-grid version hides — its own matches get replaced by their
      // RedFilterCard double (or, for silver-hoard-bead, just slid via
      // posOverride below), and every non-matching card simply has nothing
      // to replace it, freeing up that filter's own shorter canvas.
      const hiddenByCommittedFilter = !!activeFilter && card.id !== "silver-hoard-bead";
      // A card below the fold that's never scrolled into view yet has
      // revealed=false/settled=false — its image is still sitting at
      // opacity 0, waiting on the *slow* TILE_FADE_MS reveal transition
      // (see the img's own style below). Getting yanked into the cluster
      // shouldn't also play that reveal fade — that's what produced a
      // strange ~900ms crossfade the first time a given card ever became a
      // magnet target (every later hover has nothing left to reveal, so it
      // never showed up again). Forcing both flags the instant a card
      // becomes a target makes it already-visible before the fast magnet
      // transform even starts.
      useEffect(() => {
        if (!isHoverMagnetTarget) return;
        setRevealed(true);
        setSettled(true);
      }, [isHoverMagnetTarget]);

      // Typewriter reveal for the description overlay: on hover, characters
      // appear one at a time at a fast, fixed interval rather than the whole
      // paragraph showing at once. On mouse-leave it reverses the same way,
      // erasing one character at a time back down to zero (instead of just
      // snapping to 0), so the effect reads as symmetric in both directions.
      const [typedLength, setTypedLength] = useState(0);
      useEffect(() => {
        if (!card.description) return;
        const typingIn = hovered;
        const id = setInterval(() => {
          setTypedLength((n) => {
            const done = typingIn ? n >= card.description.length : n <= 0;
            if (done) {
              clearInterval(id);
              return n;
            }
            return typingIn ? n + 1 : n - 1;
          });
        }, TYPEWRITER_CHAR_MS);
        return () => clearInterval(id);
      }, [hovered]);

      const isRevealed = loaded && revealed;
      useEffect(() => {
        if (!isRevealed) return;
        const id = setTimeout(() => setSettled(true), TILE_FADE_MS);
        return () => clearTimeout(id);
      }, [isRevealed]);
      // Caption hugs the *visible artwork*, not the padded image box: its
      // ends land on the artwork's real left/right edges (title at the
      // start/right, date at the end/left), matching the reference. Most
      // files have pure-white side padding that's invisible on the cream
      // page — spanning the full box used to fling the date out into that
      // padding and under the neighbor. Still clamped to the 1728 canvas so
      // an edge card's text can't run off-screen.
      const [lf, rf] = CONTENT_FRAC[card.image.split("/").pop()] || [0, 1];
      const artLeft = offsetX + lf * iw;
      const artRight = offsetX + rf * iw;
      const [tf, bf] = CONTENT_FRAC_Y[card.image.split("/").pop()] || [0, 1];
      const artTop = tf * ih;
      const artBottom = bf * ih;
      // Position math for the hover magnet preview (see isHoverMagnetTarget
      // above): measured in real screen pixels via getBoundingClientRect
      // rather than in Figma/CARDS units, since the card's own left/top are
      // a responsive calc() (scalePx) — only a live layout measurement
      // lines up with the actual rendered position regardless of viewport
      // width or scroll position. wrapperRef's *height* specifically can't
      // be used for this, though — every one of its children is absolutely
      // positioned, so the wrapper itself never gains a real height (it
      // measures 0), and rect.top + rect.height/2 would silently collapse
      // to rect.top (the box's top edge, not its center) rather than the
      // true visual middle. Its left/top/width are still real (width is an
      // explicit style), so combined with the already-computed artLeft/
      // Right/Top/Bottom (the real artwork bounds, not the padded iw×ih
      // box) they're enough to derive the actual on-screen center directly.
      // Resetting to null snaps the transform back to "none", which is what
      // animates the return trip — no separate stored "original position"
      // needed.
      const [hoverMagnetTransform, setHoverMagnetTransform] = useState(null);
      useEffect(() => {
        if (!isHoverMagnetTarget) {
          setHoverMagnetTransform(null);
          return;
        }
        const el = wrapperRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const scale = rect.width / card.w;
        const cx = rect.left + ((artLeft + artRight) / 2) * scale;
        const cy = rect.top + ((artTop + artBottom) / 2) * scale;
        const idx = hoverFilterGroup.indexOf(card.id);
        const angle = (idx / hoverFilterGroup.length) * Math.PI * 2;
        const targetX = window.innerWidth / 2 + Math.cos(angle) * MAGNET_CLUSTER_RADIUS;
        const targetY = window.innerHeight / 2 + Math.sin(angle) * MAGNET_CLUSTER_RADIUS;
        setHoverMagnetTransform({ x: targetX - cx, y: targetY - cy, scale: MAGNET_SCALE });
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [isHoverMagnetTarget]);
      // descOffsetX/Y: a handful of cards needed a small manual nudge after
      // eyeballing against the references — either the text sat a touch too
      // far left of the artwork's true right edge, or (annunciation,
      // beheaded-sun) too high in dead space above the actual image content.
      const descTop = artTop + (card.descOffsetY || 0);
      // The blurb is a right-flush column, never the artwork's full width —
      // but exactly how narrow varies per piece (a small square crop reads
      // near edge-to-edge while a big wide painting reads at roughly half),
      // so each card with a description was measured directly against its
      // own reference screenshot and given its own descWidthFrac. 0.52 is
      // just the fallback for anything unmeasured.
      const descWidthFrac = card.descWidthFrac !== undefined ? card.descWidthFrac : 0.52;
      const descOffsetX = card.descOffsetX || 0;
      // capInsetL/R pull the title/date in from the artwork's edges when the
      // caption text itself is wider than the box (e.g. annunciation's long
      // subtitle overran the painting's left edge) — a text-length fix, not
      // an artwork-crop one, so it's kept separate from CONTENT_FRAC.
      const capLeft = Math.max(artLeft, -card.x) + (card.capInsetL || 0);
      const capWidth = Math.min(artRight, FRAME_W - card.x) - capLeft - (card.capInsetR || 0);
      return (
        <div
          id={"card-" + card.id}
          ref={wrapperRef}
          data-tile-x={card.x}
          className="absolute"
          style={{
            left: scalePx(posOverride ? posOverride.x : card.x),
            top: scalePx(posOverride ? posOverride.y : card.y),
            width: scalePx(card.w),
            transform: hoverMagnetTransform
              ? `translate(${hoverMagnetTransform.x}px, ${hoverMagnetTransform.y}px) scale(${hoverMagnetTransform.scale})`
              : "none",
            zIndex: isHoverMagnetTarget ? 20 : undefined,
            // Every card except silver-hoard-bead (the one that just slides
            // via posOverride) disappears once a filter result is
            // committed — its other match(es) get replaced by their own
            // RedFilterCard double (see App), everything else simply isn't
            // part of the result.
            opacity: hiddenByCommittedFilter ? 0 : hoverFilterDimmed ? 0.15 : 1,
            pointerEvents: hiddenByCommittedFilter ? "none" : undefined,
            // easeInOutCubic on transform, not an ease-out: an ease-out curve
            // front-loads most of a card's (often several-thousand-px,
            // off-screen) journey into its first sliver of the transition
            // and crawls the rest, which reads as "it just appeared" rather
            // than travel. This ramps up to full speed through the middle
            // of the transition and only decelerates right at the very end,
            // so the motion itself stays visible despite the short
            // duration. left/top use the same curve at the slower
            // RED_FILTER_FLY_MS pace, matching RedFilterCard's own flight
            // duration — only silver-hoard-bead ever actually moves via
            // those two properties, everyone else's left/top never change.
            transition: `transform 220ms cubic-bezier(0.65, 0, 0.35, 1), opacity 300ms ease, left ${RED_FILTER_FLY_MS}ms cubic-bezier(0.65, 0, 0.35, 1), top ${RED_FILTER_FLY_MS}ms cubic-bezier(0.65, 0, 0.35, 1)`,
          }}
        >
          {/* Photo at its own natural aspect (never letterboxed/stretched):
              full box width when it fits, otherwise shrunk to the box
              height and centred — see computeImage. object-cover here only
              trims sub-pixel rounding since iw/ih already match the aspect.
              pointer-events-none: hovering is driven by the narrower hitbox
              below (real artwork bounds only), not this full padded box —
              cards deliberately overlap (see x/y comments above), and many
              of those overlaps are large enough that hovering one card's
              plain white padding would otherwise dim a completely different,
              unrelated card sitting underneath in DOM order. */}
          <img
            src={card.image}
            alt={card.title}
            loading="lazy"
            onLoad={() => setLoaded(true)}
            className="absolute pointer-events-none"
            style={{
              left: scalePx(offsetX),
              top: 0,
              width: scalePx(iw),
              height: scalePx(ih),
              objectFit: "cover",
              objectPosition: card.coverTop ? "top" : "center",
              // When a hoverImage exists, this base image fades all the way
              // out (0) instead of just dimming — the hoverImage sibling
              // below fades in over it, so hovering crossfades to that
              // detail shot rather than just darkening this one.
              opacity: !isRevealed ? 0 : hovered ? (card.hoverImage ? 0 : HOVER_OPACITY) : 1,
              transition: `opacity ${settled ? HOVER_OPACITY_MS : TILE_FADE_MS}ms ease-in`,
            }}
          />
          {/* Only 3 of the 27 cards have a second, closer-in detail shot
              (matching those specific instances' own hover variant in the
              Figma file) — crossfades in over the base image on hover,
              dimmed the same HOVER_OPACITY as every other hovered piece. */}
          {card.hoverImage && (
            <img
              src={card.hoverImage}
              alt=""
              aria-hidden="true"
              className="absolute pointer-events-none"
              style={{
                left: scalePx(offsetX),
                top: 0,
                width: scalePx(iw),
                height: scalePx(ih),
                objectFit: "cover",
                objectPosition: card.coverTop ? "top" : "center",
                opacity: isRevealed && hovered ? HOVER_OPACITY : 0,
                transition: `opacity ${settled ? HOVER_OPACITY_MS : TILE_FADE_MS}ms ease-in`,
              }}
            />
          )}
          {/* The actual hover trigger: just the real artwork's rectangle
              (artLeft/artRight horizontally, artTop/artBottom vertically),
              not the padded image box — see the img's own comment above for
              why. Most files only need the horizontal trim; a couple (see
              CONTENT_FRAC_Y) have real content sitting in a narrow band
              with lots of empty space above/below instead. */}
          {/* Doubles as the link to the work's own page. Rendering an <a>
              with no href when the work has no inner page yet degrades to a
              plain box — no pointer cursor, not focusable. */}
          <a
            href={(window.ARTWORK_HREF || {})[card.id]}
            className="absolute pointer-events-auto"
            style={{ left: scalePx(artLeft), top: scalePx(artTop), width: scalePx(artRight - artLeft), height: scalePx(artBottom - artTop) }}
            onMouseEnter={() => setHovered(true)}
            onMouseLeave={() => setHovered(false)}
          />
          {/* The hover blurb: real museum copy (see CARDS), positioned over
              the artwork's own visible bounds and clipped to however much
              fits there — most of these paragraphs are far longer than a
              tile can show, and that's fine, it's meant to read as an
              excerpt, matching the reference. Types on character-by-
              character at TYPEWRITER_CHAR_MS (see typedLength above) rather
              than appearing all at once. Only rendered for cards that have
              one (see CARDS' own comment — not all 27 do yet). */}
          {card.description && (
            <div
              className="absolute overflow-hidden pointer-events-none text-right"
              dir="rtl"
              style={{
                left: scalePx(Math.max(artLeft + 14, artRight - 14 - (artRight - artLeft) * descWidthFrac) + descOffsetX),
                top: scalePx(descTop + 12),
                width: scalePx((artRight - artLeft) * descWidthFrac - 14),
                height: scalePx(Math.max(0, (artBottom - descTop) * 0.8)),
                fontFamily: FONT_THEBASICS,
                fontWeight: 500,
                fontSize: scalePx(16),
                lineHeight: 1.28,
                letterSpacing: "-0.01em",
                color: "#28282a",
                opacity: isRevealed && (hovered || typedLength > 0) ? 1 : 0,
                transition: `opacity ${settled ? HOVER_OPACITY_MS : TILE_FADE_MS}ms ease-in`,
              }}
            >
              {card.description.slice(0, typedLength)}
            </div>
          )}
          {/* Caption sits directly under the image, spanning its width
              (clamped to the canvas): title flush right, artist/year flush
              left. No background — it must read as plain text sitting on
              the page, not a box. zIndex 1 still lifts it above any
              earlier-DOM card image below (see card x/y comments above for
              why boxes overlap by design). HoverWord gives the title/date
              the same underline-sweep hover as every other piece of text on
              the site, rather than plain static spans. */}
          <div
            className="absolute flex justify-between"
            dir="rtl"
            style={{
              left: scalePx(capLeft),
              top: scalePx(captionTop + (card.capDY || 0)),
              width: scalePx(capWidth),
              zIndex: 1,
              fontFamily: FONT_THEBASICS,
              fontWeight: 500,
              fontSize: scalePx(16),
              // Hidden outright (not just dimmed like the rest of a
              // filtered-out card) while the hover-magnet preview is active
              // — the title/date clutter the enlarged, overlapping preview
              // cluster and don't read as useful at that size anyway. Only
              // tied to the transient hover preview, not the click-committed
              // result — there, silver-hoard-bead's caption is the real
              // caption of the actual result and should stay visible.
              opacity: hoverFilter ? 0 : 1,
              transition: "opacity 180ms ease",
            }}
          >
            <HoverWord label={card.title} active={hovered} />
            <HoverWord label={card.subtitle} active={hovered} />
          </div>
        </div>
      );
    }

    // The אדום-filtered result view (see RED_FILTER_LAYOUT): unlike Card
    // above, these 6 boxes are cover-cropped (fill the given w×h exactly,
    // no letterboxing) rather than contain-fit at the artwork's own aspect
    // — that's how the dedicated Figma frame for this state renders them,
    // and it's also just simpler than fighting Card's grid-specific
    // contain/CONTENT_FRAC machinery for a one-off static result screen.
    // Caption sits directly below the box (via percentage-based "100%"
    // positioning, so it keeps tracking the box's own bottom edge for free
    // as the box's height animates — no per-frame JS needed), in the same
    // title-right/subtitle-left pattern as every other caption on the site.
    //
    // Always mounted (even before the filter is ever clicked), sitting
    // invisibly at its card's normal-grid box — that's what lets the actual
    // fly animation just be a plain two-value position/size CSS transition:
    // on activation it's given the real RED_FILTER_LAYOUT box and fades in,
    // and because both boxes live in the same raw 1728-wide canvas
    // coordinate space, the browser interpolates the move+resize on its
    // own. Card's own copy of this card fades out at the same time (see its
    // own opacity rule), so the two crossfade into and out of each other
    // right where the normal grid original was sitting.
    function RedFilterCard({ card, target, active, hoverFilter }) {
      const [pos, setPos] = useState({ x: card.x, y: card.y, w: card.w, h: card.h });
      const rafIds = useRef([]);
      const wrapperRef = useRef(null);
      useEffect(() => {
        rafIds.current.forEach((id) => cancelAnimationFrame(id));
        rafIds.current = [];
        const next = active ? target : { x: card.x, y: card.y, w: card.w, h: card.h };
        rafIds.current.push(requestAnimationFrame(() => {
          rafIds.current.push(requestAnimationFrame(() => setPos(next)));
        }));
        return () => {
          rafIds.current.forEach((id) => cancelAnimationFrame(id));
          rafIds.current = [];
        };
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [active]);

      // Same hover-magnet preview as Card's (see its own comment) — only
      // reachable once this specific committed result is already showing
      // (active), for a hover on the *next* filter down the line (e.g.
      // hovering "אבן" while "אדום" is already committed, previewing the
      // narrower stone-only result before it's actually clicked). Card's
      // own copy of a card sharing this same id is hidden at that point
      // (see hiddenByCommittedFilter), so this is the only visible surface
      // that CAN preview the motion for it.
      const hoverFilterGroup = FILTER_MATCHES[hoverFilter];
      const isHoverMagnetTarget = active && !!hoverFilterGroup && hoverFilterGroup.includes(card.id);
      const [hoverMagnetTransform, setHoverMagnetTransform] = useState(null);
      useEffect(() => {
        if (!isHoverMagnetTarget) {
          setHoverMagnetTransform(null);
          return;
        }
        const el = wrapperRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const idx = hoverFilterGroup.indexOf(card.id);
        const angle = (idx / hoverFilterGroup.length) * Math.PI * 2;
        const targetX = window.innerWidth / 2 + Math.cos(angle) * MAGNET_CLUSTER_RADIUS;
        const targetY = window.innerHeight / 2 + Math.sin(angle) * MAGNET_CLUSTER_RADIUS;
        setHoverMagnetTransform({ x: targetX - cx, y: targetY - cy, scale: MAGNET_SCALE });
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [isHoverMagnetTarget]);

      // Same hover interaction as Card (dim the piece, crossfade in a
      // hoverImage if it has one, type out `description` over the artwork,
      // underline the caption) — these boxes are cover-cropped with no
      // letterboxing, so unlike Card's narrower artLeft/Right/Top/Bottom
      // hitbox, the *entire* box is real artwork and can be the hover
      // target directly.
      const [hovered, setHovered] = useState(false);
      const [typedLength, setTypedLength] = useState(0);
      useEffect(() => {
        if (!card.description) return;
        const typingIn = hovered;
        const id = setInterval(() => {
          setTypedLength((n) => {
            const done = typingIn ? n >= card.description.length : n <= 0;
            if (done) {
              clearInterval(id);
              return n;
            }
            return typingIn ? n + 1 : n - 1;
          });
        }, TYPEWRITER_CHAR_MS);
        return () => clearInterval(id);
      }, [hovered]);
      // Same artLeft/Right/Top/Bottom bounds Card computes for its
      // description overlay — the real visible artwork, excluding any
      // baked-in white mat baked into the source photo — just measured
      // against this box's own w/h instead of Card's iw/ih. Valid for the
      // same reason capInsetL/R reused CONTENT_FRAC here (see
      // RED_FILTER_LAYOUT's own comments): cover-crop shows ~the whole
      // photo since every box's aspect nearly matches its source image's.
      // target.fullBleed opts out of that (see STONE_FILTER_LAYOUT's own
      // comment) for boxes whose aspect *doesn't* match the source photo's,
      // where CONTENT_FRAC's fractions would misfire.
      const imgFile = card.image.split("/").pop();
      const [lf, rf] = target.fullBleed ? [0, 1] : CONTENT_FRAC[imgFile] || [0, 1];
      const artLeft = lf * pos.w;
      const artRight = rf * pos.w;
      const [tf, bf] = target.fullBleed ? [0, 1] : CONTENT_FRAC_Y[imgFile] || [0, 1];
      const artTop = tf * pos.h;
      const artBottom = bf * pos.h;
      const descWidthFrac = card.descWidthFrac !== undefined ? card.descWidthFrac : 0.52;
      const descOffsetX = card.descOffsetX || 0;
      // target.descOffsetY (set per RED_FILTER_LAYOUT/STONE_FILTER_LAYOUT
      // entry) overrides the base card's own descOffsetY — needed because
      // this box can be a very different size from the card's normal-grid
      // box (e.g. pastilli-chair's filtered box is 881 tall vs its normal
      // 561), so the same fixed offset that looks right in one leaves a
      // much bigger absolute gap before the real artwork in the other.
      const descTop = artTop + (target.descOffsetY !== undefined ? target.descOffsetY : (card.descOffsetY || 0));

      return (
        <div
          ref={wrapperRef}
          className="absolute"
          style={{
            left: scalePx(pos.x),
            top: scalePx(pos.y),
            width: scalePx(pos.w),
            opacity: active ? 1 : 0,
            pointerEvents: active ? "auto" : "none",
            transform: hoverMagnetTransform
              ? `translate(${hoverMagnetTransform.x}px, ${hoverMagnetTransform.y}px) scale(${hoverMagnetTransform.scale})`
              : "none",
            zIndex: isHoverMagnetTarget ? 20 : undefined,
            transition: `left ${RED_FILTER_FLY_MS}ms cubic-bezier(0.65, 0, 0.35, 1), top ${RED_FILTER_FLY_MS}ms cubic-bezier(0.65, 0, 0.35, 1), width ${RED_FILTER_FLY_MS}ms cubic-bezier(0.65, 0, 0.35, 1), opacity 300ms ease, transform 220ms cubic-bezier(0.65, 0, 0.35, 1)`,
          }}
        >
          {/* overflow-hidden lives ONLY on this inner image box, not on the
              outer wrapper above — the caption below is a normal-flow
              sibling of this box (not absolutely positioned past its
              bottom edge), so putting overflow-hidden up on the wrapper
              instead would clip the caption entirely, which is exactly
              what was happening before this was split in two. */}
          <div
            className="relative overflow-hidden"
            style={{ width: "100%", height: scalePx(pos.h), transition: `height ${RED_FILTER_FLY_MS}ms cubic-bezier(0.65, 0, 0.35, 1)` }}
          >
            <img
              src={card.image}
              alt={card.title}
              className="absolute inset-0 w-full h-full"
              style={{
                objectFit: "cover",
                objectPosition: "center",
                opacity: hovered ? (card.hoverImage ? 0 : HOVER_OPACITY) : 1,
                transition: `opacity ${HOVER_OPACITY_MS}ms ease-in`,
              }}
            />
            {card.hoverImage && (
              <img
                src={card.hoverImage}
                alt=""
                aria-hidden="true"
                className="absolute inset-0 w-full h-full pointer-events-none"
                style={{
                  objectFit: "cover",
                  objectPosition: "center",
                  opacity: hovered ? HOVER_OPACITY : 0,
                  transition: `opacity ${HOVER_OPACITY_MS}ms ease-in`,
                }}
              />
            )}
            <div
              className="absolute inset-0"
              style={{ pointerEvents: active ? "auto" : "none" }}
              onMouseEnter={() => setHovered(true)}
              onMouseLeave={() => setHovered(false)}
            />
            {card.description && (
              <div
                className="absolute overflow-hidden pointer-events-none text-right"
                dir="rtl"
                style={{
                  left: scalePx(Math.max(artLeft + 14, artRight - 14 - (artRight - artLeft) * descWidthFrac) + descOffsetX),
                  top: scalePx(descTop + 12),
                  width: scalePx((artRight - artLeft) * descWidthFrac - 14),
                  height: scalePx(Math.max(0, (artBottom - descTop) * 0.8)),
                  fontFamily: FONT_THEBASICS,
                  fontWeight: 500,
                  fontSize: scalePx(16),
                  lineHeight: 1.28,
                  letterSpacing: "-0.01em",
                  color: "#28282a",
                  opacity: hovered || typedLength > 0 ? 1 : 0,
                  transition: `opacity ${HOVER_OPACITY_MS}ms ease-in`,
                }}
              >
                {card.description.slice(0, typedLength)}
              </div>
            )}
          </div>
          <div
            className="relative flex justify-between"
            dir="rtl"
            style={{
              zIndex: 1,
              marginTop: scalePx(CARD_CAPTION_GAP + (target.capDY || 0)),
              width: "100%",
              paddingRight: scalePx(target.capInsetR || 0),
              paddingLeft: scalePx(target.capInsetL || 0),
              fontFamily: FONT_THEBASICS,
              fontWeight: 500,
              fontSize: scalePx(16),
            }}
          >
            <HoverWord label={card.title} active={hovered} />
            <HoverWord label={card.subtitle} active={hovered} />
          </div>
        </div>
      );
    }

    function App() {
      // Same soft whole-page fade used on index.html's arrival from here
      // (see its skipIntro/pageFadeIn) — this direction plays it
      // unconditionally on every load, since there's no competing intro
      // state machine to skip on this page.
      const [pageFadeIn, setPageFadeIn] = useState(false);
      useEffect(() => {
        const id = setTimeout(() => setPageFadeIn(true), 60);
        return () => clearTimeout(id);
      }, []);
      // This is a two-step "choose a color, then narrow by material" flow,
      // not two independent toggles: colorFilter ("אדום") is the base
      // committed result (RED_FILTER_LAYOUT, all 7 matches); materialFilter
      // ("אבן") only ever narrows an already-chosen color down further (to
      // just its own matches within that color, per STONE_FILTER_LAYOUT) —
      // clicking אבן before a color is chosen does nothing (see
      // onSelectFilter below). Both stay underlined at once when both are
      // set (see FilterMenu's highlightedFilters), since they're two
      // different filter dimensions being applied together, not
      // alternatives. `activeFilter` is the single value that actually
      // governs which layout is showing right now — materialFilter wins
      // once set, since it's strictly narrower than colorFilter alone.
      // ניקוי resets both back to the normal collage.
      // hoverFilter is the separate, transient hover-preview word (see
      // Card's isHoverMagnetTarget) — cleared whenever a filter commits so
      // the two never fight over the same cards.
      const [colorFilter, setColorFilter] = useState(null);
      const [materialFilter, setMaterialFilter] = useState(null);
      const activeFilter = materialFilter || colorFilter;
      const [hoverFilter, setHoverFilter] = useState(null);
      const [searchOpen, setSearchOpen] = useState(false);

      return (
        <div className="min-h-screen w-full bg-[#fffdfa] relative" dir="rtl">
          {/* Fixed header overlay — pinned to the viewport, doesn't scroll.
              Holds everything that stays put while the gallery scrolls
              under it: nav (left), the motif tag row (center), the wordmark
              mark (right), and the color/material filter menu (top-right,
              below the wordmark). The description paragraph + circle
              thumbnail are NOT here — they scroll away with the grid.
              Deliberately outside the pageFadeIn wrapper below — the nav
              bar stays fully visible immediately rather than fading in with
              the rest of the page. */}
          <div id="cc-header-overlay" className="fixed inset-x-0 top-0 z-30 flex justify-center pointer-events-none">
            <div className={"relative " + CANVAS_W}>
              <div className="absolute pointer-events-auto" style={{ insetInlineEnd: scalePx(24), top: scalePx(32) }}>
                <TopNav onSearchToggle={() => setSearchOpen((v) => !v)} />
              </div>
              <div className="absolute pointer-events-auto" style={{ left: scalePx(614), top: scalePx(19) }}>
                <MotifTagRow />
              </div>
              <HeaderWordmarkLink style={{ right: scalePx(24), top: scalePx(31), width: scalePx(247), height: scalePx(25) }} />
              <div className="absolute" style={{ right: scalePx(24), top: scalePx(189) }}>
                <FilterMenu
                  highlightedFilters={[colorFilter, materialFilter].filter(Boolean)}
                  onFilterHover={(opt) => {
                    setHoverFilter(opt);
                  }}
                  onSelectFilter={(opt) => {
                    setHoverFilter(null);
                    if (opt === "אדום") {
                      setColorFilter("אדום");
                      setMaterialFilter(null);
                    } else if (opt === "אבן") {
                      // Only available once a color is already committed —
                      // see the comment on colorFilter/materialFilter above.
                      if (colorFilter) setMaterialFilter("אבן");
                    }
                  }}
                  onClear={() => {
                    setColorFilter(null);
                    setMaterialFilter(null);
                  }}
                />
              </div>
              <SearchBar open={searchOpen} onClose={() => setSearchOpen(false)} />
            </div>
          </div>

          <div
            id="cc-canvas"
            className={"relative mx-auto " + CANVAS_W}
            style={{
              height: scalePx(
                activeFilter === "אדום" ? RED_FILTER_CANVAS_H : activeFilter === "אבן" ? STONE_FILTER_CANVAS_H : CANVAS_H
              ),
              // Both axes now, not just X: every card stays mounted (just
              // opacity 0) even while a committed result's shorter canvas
              // height is active, so the non-matching cards still sit
              // at their tall normal-grid y positions below the visible
              // fold — invisible, but without a Y clip they'd still expand
              // the page's actual scrollable area past the intended
              // shorter result.
              overflow: "clip",
              opacity: pageFadeIn ? 1 : 0,
              transition: `opacity 500ms ease, height ${RED_FILTER_FLY_MS}ms cubic-bezier(0.65, 0, 0.35, 1)`,
            }}
          >
            {/* Small looping preview of the same circle reel used on the
                home page's hero, matching the design's little rounded
                thumbnail next to the motif description. */}
            <div
              id="cc-circle-video"
              className="absolute overflow-hidden"
              style={{ left: scalePx(983), top: scalePx(189), width: scalePx(129), height: scalePx(64) }}
            >
              <video src="public/videos/circle_1.mp4" autoPlay loop muted playsInline className="w-full h-full object-cover" />
            </div>

            <p
              id="cc-description"
              className="absolute text-right"
              dir="rtl"
              style={{
                left: scalePx(337),
                top: scalePx(183),
                width: scalePx(636),
                fontFamily: FONT_THEBASICS,
                fontSize: scalePx(20),
                lineHeight: 1.21,
                letterSpacing: "-0.2px",
              }}
            >
              מעגל המעגל הוא צורה בלי התחלה וסוף, ולכן שימש לאורך תולדות האמנות כסימן לנצח, לשלמות ולמחזוריות. הוא הצורה של הקדושה,
              ובתאוריית הרנסנס נחשב לצורה המושלמת ביותר. באמנות המודרנית הפך ליסוד פורמלי טהור.
            </p>

            {/* Every card stays mounted all the time now, whether or not a
                committed result is active — that's what makes the
                click-to-filter transition a plain CSS position/opacity
                animation instead of a component swap: Card just gets told
                to fade out (or, for silver-hoard-bead, to slide) while its
                RedFilterCard double (for that filter's other match(es))
                fades in and flies from that same normal-grid spot to its
                own layout box. See Card's and RedFilterCard's own comments
                for the mechanics. */}
            {LAID_OUT_CARDS.map((card) => {
              const beadPos =
                card.id === "silver-hoard-bead" && activeFilter === "אדום"
                  ? RED_FILTER_BEAD_POS
                  : card.id === "silver-hoard-bead" && activeFilter === "אבן"
                  ? STONE_FILTER_BEAD_POS
                  : undefined;
              return (
                <Card
                  key={card.id}
                  // Merge the filter-state overrides (capInsetR to keep its
                  // caption clear of red-sun's) into the card itself, since
                  // caption geometry reads from `card`; posOverride only
                  // moves the wrapper box.
                  card={beadPos ? { ...card, ...beadPos } : card}
                  hoverFilter={hoverFilter}
                  activeFilter={activeFilter}
                  hoverMagnetSuppressed={!!materialFilter}
                  posOverride={beadPos}
                />
              );
            })}
            {RED_FILTER_LAYOUT.map((layout) => (
              <RedFilterCard
                key={"red-" + layout.id}
                card={CARDS_BY_ID[layout.id]}
                target={layout}
                active={activeFilter === "אדום"}
                hoverFilter={hoverFilter}
              />
            ))}
            {STONE_FILTER_LAYOUT.map((layout) => (
              <RedFilterCard
                key={"stone-" + layout.id}
                card={CARDS_BY_ID[layout.id]}
                target={layout}
                active={activeFilter === "אבן"}
                hoverFilter={hoverFilter}
              />
            ))}

            {/* Footer — same אודות / יצירת קשר + wordmark + about-copy
                pattern as index.html's AboutSection, just laid out at this
                page's own footer position instead of sticky mid-page. */}
            <div
              id="cc-footer-about"
              className="absolute"
              style={{
                left: scalePx(167),
                top: scalePx(
                  activeFilter === "אדום"
                    ? RED_FILTER_FOOTER_LINKS_TOP
                    : activeFilter === "אבן"
                    ? STONE_FILTER_FOOTER_LINKS_TOP
                    : FOOTER_LINKS_TOP
                ),
                fontFamily: FONT_THEBASICS,
                fontSize: scalePx(20),
                letterSpacing: "0.2px",
                transition: `top ${RED_FILTER_FLY_MS}ms cubic-bezier(0.65, 0, 0.35, 1)`,
              }}
            >
              <NavLink label="אודות" href="about.html" />
            </div>
            <div
              id="cc-footer-contact"
              className="absolute text-right"
              dir="rtl"
              style={{
                left: scalePx(-128),
                top: scalePx(
                  activeFilter === "אדום"
                    ? RED_FILTER_FOOTER_LINKS_TOP
                    : activeFilter === "אבן"
                    ? STONE_FILTER_FOOTER_LINKS_TOP
                    : FOOTER_LINKS_TOP
                ),
                width: scalePx(240),
                fontFamily: FONT_THEBASICS,
                fontSize: scalePx(20),
                letterSpacing: "0.2px",
                transition: `top ${RED_FILTER_FLY_MS}ms cubic-bezier(0.65, 0, 0.35, 1)`,
              }}
            >
              <NavLink label="יצירת קשר" href="#contact" />
            </div>
            <p
              id="cc-footer-paragraph"
              className="absolute text-right"
              dir="rtl"
              style={{
                right: scalePx(23),
                top: scalePx(
                  activeFilter === "אדום"
                    ? RED_FILTER_FOOTER_PARAGRAPH_TOP
                    : activeFilter === "אבן"
                    ? STONE_FILTER_FOOTER_PARAGRAPH_TOP
                    : FOOTER_PARAGRAPH_TOP
                ),
                width: scalePx(875),
                fontWeight: 500,
                fontSize: scalePx(20),
                lineHeight: 1.21,
                letterSpacing: "-0.02em",
                transition: `top ${RED_FILTER_FLY_MS}ms cubic-bezier(0.65, 0, 0.35, 1)`,
              }}
            >
              <span style={{ fontFamily: FONT_MASADA }}>אוספי מוזיאון ישראל</span>
              <span style={{ fontFamily: FONT_THEBASICS }}> מונים כ-500 אלף פריטים המשתרעים על כל קשת התרבות החומרית, מהפרהיסטוריה ועד ימינו. האוסף מאורגן בשלושה אגפים מרכזיים — ארכאולוגיה, אמנות, ואמנות יהודית — וכולל את האחזקות הגדולות בעולם של ארכאולוגיה מקראית וארץ-ישראלית, לצד אמנות יפה, צילום, עיצוב, אתנוגרפיה וחפצי פולחן.</span>
            </p>
            <AnimatedFooterWordmark
              id="cc-footer-wordmark"
              style={{
                left: scalePx(24),
                top: scalePx(
                  activeFilter === "אדום"
                    ? RED_FILTER_FOOTER_WORDMARK_TOP
                    : activeFilter === "אבן"
                    ? STONE_FILTER_FOOTER_WORDMARK_TOP
                    : FOOTER_WORDMARK_TOP
                ),
                width: scalePx(1679),
                height: scalePx(170),
                transition: `top ${RED_FILTER_FLY_MS}ms cubic-bezier(0.65, 0, 0.35, 1)`,
              }}
            />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>(function(){var done=false;function reveal(){if(done)return;done=true;var b=document.body;if(b){b.style.transition="opacity .25s ease";b.style.opacity="1";}}function ready(){try{var p=document.createElement("div");p.className="absolute";p.setAttribute("aria-hidden","true");document.body.appendChild(p);var ok=getComputedStyle(p).position==="absolute";p.remove();if(!ok)return requestAnimationFrame(ready);}catch(e){}var r=document.getElementById("root");if(r&&r.children.length===0)return requestAnimationFrame(ready);reveal();}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",ready);else ready();setTimeout(reveal,3000);})();</script>
</body>
