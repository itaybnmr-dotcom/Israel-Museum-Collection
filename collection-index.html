<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>אוספי מוזיאון ישראל</title>
  <meta name="description" content="אינדקס מלא של יצירות אוספי מוזיאון ישראל, לפי שם, יוצר.ת וטכניקה." />
  <link rel="icon" type="image/svg+xml" href="public/images/favicon.svg" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="artworks-data.js"></script>
  <script src="search-engine.js"></script>
  <style>
    @view-transition {
      navigation: auto;
    }
    ::view-transition-group(root) {
      animation-duration: 0.42s;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    ::view-transition-old(root),
    ::view-transition-new(root) {
      mix-blend-mode: normal;
    }
    /* The nav bar carries a persistent view-transition-name (site-header) so
       it morphs instead of cross-fading — but the browser still runs its
       default old/new fade *underneath* that morph, and since the two
       snapshots are almost-but-not-quite pixel-identical (font hinting,
       subpixel rounding) that reads as a flicker. Freezing it removes that. */
    ::view-transition-old(site-header),
    ::view-transition-new(site-header) {
      animation: none;
      mix-blend-mode: normal;
    }
    /* Also freeze the group's own position/size interpolation — otherwise
       even a 1px geometry mismatch between two pages' headers (they're
       hand-tuned per page) makes it visibly slide during the crossfade. */
    ::view-transition-group(site-header) {
      animation: none;
    }
    @font-face {
      font-family: 'TheBasics';
      src: url('public/fonts/TheBasics-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheBasics';
      src: url('public/fonts/TheBasics-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheBasics';
      src: url('public/fonts/TheBasics-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Masada';
      src: url('public/fonts/Masada-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      background-color: #fffdfa;
      color: #28282a;
      font-family: 'TheBasics', 'Segoe UI', Arial, sans-serif;
      font-weight: 500;
      overflow-x: hidden;
      max-width: 100%;
    }

    ::selection {
      background-color: #28282a;
      color: #fffdfa;
    }
  </style>
  <style>
    #tile-idx100 { border: none !important; box-shadow: none !important; outline: none !important; }
    #tile-idx100 img { border: none !important; box-shadow: none !important; outline: none !important; filter: none !important; }
    #tile-idx100::before, #tile-idx100::after { display: none !important; }
    #tile-idx100 img::before, #tile-idx100 img::after { display: none !important; }

    .caption-container-row {
      display: flex !important;
      justify-content: space-between !important;
      align-items: flex-start !important;
      direction: rtl !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    .caption-title-side {
      text-align: right !important;
      flex-shrink: 0 !important;
      max-width: 55% !important;
      word-break: keep-all !important;
      white-space: normal !important;
    }
    .caption-metadata-side {
      text-align: left !important;
      flex-grow: 1 !important;
      min-width: 0 !important;
      max-width: 70% !important;
      word-break: keep-all !important;
      white-space: normal !important;
    }
    .caption-metadata-side span.date-string {
      white-space: nowrap !important;
    }

    /* idx30 "הצד העליון של השמים": natural title width 122px = 56.7% of 215px container.
       Global 55% cap = 118px causes a 4px shortfall → 2-line wrap.
       57% = 122.6px gives just enough room; subtitle "קיי סייג׳, 1944" = 77px < 42% = 90px ✓ */
    #tile-idx30 .caption-title-side { max-width: 58% !important; }

    /* idx19 "ללא שם, המאה ה‑11 לפנה״ס": Figma gives subtitle 75.8% (188px).
       Global 70% = 145px is exactly the natural text width → rounding causes 2-line wrap.
       76% gives 157px, comfortably fitting the text on 1 line. */
    #tile-idx19 .caption-metadata-side { max-width: 76% !important; }

    /* idx47: title "כד גלילי לגבינה מיובאת ממצרים" at global 55% = 113px squeezes
       subtitle to 45% = 93px → 3-line wrap. Reducing title to 45% gives subtitle
       55% = 113px → 2 lines ("ללא שם, 3,500‑5000" / "לפנה״ס"), matching Figma. */
    #tile-idx47 .caption-title-side { max-width: 45% !important; }

    /* idx36 "חזית חנות": subtitle "כריסטו יאווצ׳ף, 1964‑1965" natural = 142px, fits on 1 line.
       Capping at 42% = 87.8px forces "1964‑1965" (64px) to wrap as its own left-aligned line. */
    #tile-idx36 .caption-metadata-side { max-width: 42% !important; }

    /* idx12 "אתלטיקה קלה": subtitle "ליזלוטה גרבז׳ינה, 1930" at 1280px viewport.
       52% = 95px fits "ליזלוטה גרבז׳ינה," on line 1; "1930" wraps to line 2. */
    #tile-idx12 .caption-metadata-side { max-width: 52% !important; }

    /* idx13 "בלי כותרת (לבוב ופט רום)": global 55% title cap (113px) leaves only
       93px for subtitle "דן פלווין, 1969‑1970" (natural 109px) → 2-line wrap.
       Figma title box is 42.9% (106px). Setting 45% gives subtitle 55% = 113px > 109px ✓ */
    #tile-idx13 .caption-title-side { max-width: 45% !important; }

    /* idx58 "לוחית המתארת את האלים ננה ונינגל": natural title width 198px = 56.3% of 352px.
       Global 55% cap (194px) is 5px short → 2-line wrap. 57% = 201px gives 3px breathing room. */
    #tile-idx58 .caption-title-side { max-width: 57% !important; white-space: nowrap !important; }

    /* idx54 "כרזה לסרט ״אקסודוס״": natural title width 122px = 55.9% of 218px container.
       Global 55% cap (120px) is 2px short → 2-line wrap. 57% = 124px gives 2px breathing room. */
    #tile-idx54 .caption-title-side { max-width: 57% !important; white-space: nowrap !important; }

    /* idx91 "צלחת גדולה ועליה מגולפים סמלים": Figma title box is 66.2% (258px), H=15 (1 line).
       Global 55% cap (180px) < natural title width (186px) → 2-line wrap.
       58% = 189px gives 3px breathing room; subtitle "המאה ה-4 לפנה״ס" gets 42% = 137px ✓ */
    #tile-idx91 .caption-title-side { max-width: 58% !important; }

    /* idx94 "שבר שפה של קערת זכוכית פסיפס": Figma title box is 62.8% (223px), H=14 (1 line).
       Global 55% cap (163px) < natural title width (179px) → 2-line wrap.
       62% = 184px gives 5px breathing room; subtitle "המאה ה-1 לספירה" gets 38% = 112px ✓ */
    #tile-idx94 .caption-title-side { max-width: 62% !important; white-space: nowrap !important; }

    /* idx69 "מחסה ארעי למהגרי עבודה בארקנסו": title natural width = 55.1% of container,
       just over the 55% global cap → wraps. 57% gives 2% breathing room; nowrap keeps
       the subtitle "בן שאן, 1935" on one line even if container is slightly tight. */
    #tile-idx69 .caption-title-side { max-width: 61% !important; white-space: nowrap !important; }
    #tile-idx69 .caption-metadata-side { white-space: nowrap !important; }

    /* Cursor-proximity speed: JS sets --hover-speed on each tile; !important overrides
       the transition-duration from React's inline `transition` shorthand. */
    [id^="tile-idx"] img { transition-duration: var(--hover-speed, 50ms) !important; }

    .artwork-cluster-img,
    .artwork-cluster-img img {
      background: none !important;
      background-color: transparent !important;
      border: none !important;
      border-color: transparent !important;
      outline: none !important;
      box-shadow: none !important;
      filter: none !important;
    }

    /* List-view dimension column: uniform ltr left-aligned nowrap for all rows */
    .list-dim-cell {
      direction: ltr !important;
      text-align: left !important;
      white-space: nowrap !important;
      padding-right: 0 !important;
      margin-right: 0 !important;
    }
    .list-dim-cell > span.relative {
      margin-left: 0 !important;
      display: inline-block !important;
    }
  </style>
</head>
<body>
  <!-- Static, JS-free header: React/ReactDOM/Babel-standalone all load from a
       CDN and the whole page script has to be parsed and transpiled before
       React paints anything, so on every navigation there's a real gap where
       the document is blank and the nav bar vanishes. This markup needs no
       JS at all, so it paints on the very first frame and carries the
       site-header view-transition name itself (the React-rendered header
       below no longer claims it — a name can only be claimed by one element
       at a time). It sits one z-index below the real header and is never
       removed; once React mounts, its own header simply covers this one, so
       there's no visible swap — as long as both agree on exact geometry
       (right/top/width/height/gap below), which is why those are hardcoded
       to match every page's own HeaderWordmarkLink/TopNav values exactly
       rather than copy-pasted loosely. -->
  <div style="position:fixed;inset-inline:0;top:0;z-index:29;display:flex;justify-content:center;pointer-events:none;view-transition-name:site-header;">
    <div dir="rtl" style="position:relative;width:min(1728px,100vw);">
      <a href="index.html" style="position:absolute;right:calc(min(1728px,100vw) * 0.013889);top:calc(min(1728px,100vw) * 0.017940);width:calc(min(1728px,100vw) * 0.142940);height:calc(min(1728px,100vw) * 0.014468);pointer-events:auto;display:block;">
        <img src="public/images/wordmark.svg" alt="אוספי מוזיאון ישראל" style="width:100%;height:100%;display:block;" />
      </a>
      <nav dir="rtl" style="position:absolute;inset-inline-end:calc(min(1728px,100vw) * 0.013889);top:calc(min(1728px,100vw) * 0.018519);display:flex;align-items:center;gap:20px;pointer-events:auto;font-family:'TheBasics','Segoe UI',Arial,sans-serif;font-weight:500;font-size:calc(min(1728px,100vw) * 0.011574);letter-spacing:0.2px;">
        <a href="index.html#about" style="color:#28282a;text-decoration:none;">אסופות</a>
        <a href="collection-index.html" style="color:#28282a;text-decoration:none;">אינדקס</a>
        <a href="search.html" style="color:#28282a;text-decoration:none;">חיפוש</a>
        <a href="about.html" style="color:#28282a;text-decoration:none;">אודות</a>
      </nav>
    </div>
  </div>

  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useRef, useEffect, useCallback } = React;

    const FONT_THEBASICS = "TheBasics, \"Segoe UI\", Arial, sans-serif";
    const FONT_MASADA = "Masada, \"Segoe UI\", Arial, sans-serif";

    const TILE_FADE_MS = 500;

    // Same footer wordmark mechanism as collection-circle.html (see its own
    // comment) — public/images/wordmark-blank.svg has the two icon-slot
    // shapes removed so real <img> glyphs can be cycled over them.
    const HERO_VIDEOS = [
      "public/videos/circle_1.mp4",
      "public/videos/vertical_landscape.mp4",
      "public/videos/window_1.mp4",
      "public/videos/motion.mp4",
      "public/videos/shard_1.mp4",
    ];

    const WORDMARK_HOVER_FADE_MS = 200;

    // Small header wordmark: same hover-plays-hero-reel / click-returns-home
    // behavior as collection-circle.html's own HeaderWordmarkLink.
    function HeaderWordmarkLink({ style }) {
      const [video, setVideo] = useState(null);
      const [mounted, setMounted] = useState(false);
      const [visible, setVisible] = useState(false);
      const rafIds = useRef([]);
      const closeTimer = useRef(null);

      useEffect(() => {
        rafIds.current.forEach((id) => cancelAnimationFrame(id));
        rafIds.current = [];
        clearTimeout(closeTimer.current);
        if (video) {
          setMounted(true);
          setVisible(false);
          rafIds.current.push(requestAnimationFrame(() => {
            rafIds.current.push(requestAnimationFrame(() => setVisible(true)));
          }));
        } else if (mounted) {
          setVisible(false);
          closeTimer.current = setTimeout(() => setMounted(false), WORDMARK_HOVER_FADE_MS);
        }
        return () => {
          rafIds.current.forEach((id) => cancelAnimationFrame(id));
          rafIds.current = [];
          clearTimeout(closeTimer.current);
        };
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [video]);

      return (
        <a
          href="index.html"
          className="absolute pointer-events-auto"
          style={{ ...style, zIndex: 41 }}
          onMouseEnter={() => setVideo(HERO_VIDEOS[Math.floor(Math.random() * HERO_VIDEOS.length)])}
          onMouseLeave={() => setVideo(null)}
          onClick={() => {
            if (video) sessionStorage.setItem("heroVideo", video);
          }}
        >
          <img src="public/images/wordmark.svg" alt="אוספי מוזיאון ישראל" style={{ width: "100%", height: "100%", display: "block", position: "relative", zIndex: 2 }} />
          {mounted && (
            <div
              className="fixed inset-0 overflow-hidden pointer-events-none"
              style={{ zIndex: 1, opacity: visible ? 1 : 0, transition: `opacity ${WORDMARK_HOVER_FADE_MS}ms ease` }}
            >
              <video key={video} src={video} autoPlay loop muted playsInline className="w-full h-full object-cover" />
            </div>
          )}
        </a>
      );
    }

    const WORDMARK_ICONS = [
      "public/images/icon-circle.svg",
      "public/images/icon-verticality.svg",
      "public/images/icon-gate.svg",
      "public/images/icon-motion.svg",
      "public/images/icon-fragment.svg",
    ];
    const WORDMARK_ICON_SLOTS = [
      { left: 1135.5, top: 30.3, width: 122.4, height: 118.9 },
      { left: 475.3, top: 30.3, width: 117.4, height: 118.9 },
    ];
    const WORDMARK_ICON_INTERVAL_MS = 200;

    function CyclingIcon({ src, style }) {
      return <img src={src} alt="" aria-hidden="true" style={{ ...style, objectFit: "contain" }} />;
    }

    function AnimatedFooterWordmark({ style, id }) {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setTick((t) => t + 1), WORDMARK_ICON_INTERVAL_MS);
        return () => clearInterval(id);
      }, []);
      return (
        <div id={id} className="absolute" style={{ ...style, position: "absolute" }}>
          <img src="public/images/wordmark-blank.svg" alt="אוספי מוזיאון ישראל" style={{ width: "100%", height: "100%" }} />
          {WORDMARK_ICON_SLOTS.map((slot, i) => (
            <CyclingIcon
              key={i}
              src={WORDMARK_ICONS[(tick + i * 2) % WORDMARK_ICONS.length]}
              style={{ position: "absolute", left: scalePx(slot.left), top: scalePx(slot.top), width: scalePx(slot.width), height: scalePx(slot.height) }}
            />
          ))}
        </div>
      );
    }

    const UNDERLINE_OFFSET = "0.08em";
    const UNDERLINE_THICKNESS = "0.1em";

    // Same 1728px-wide Figma frame / scalePx system as every other page.
    const FRAME_W = 1728;
    const scalePx = (px) => `calc(min(${FRAME_W}px, 100vw) * ${(px / FRAME_W).toFixed(6)})`;
    const CANVAS_W = "w-[1728px] max-w-full";

    // On this page אינדקס is the current section (hardcoded, underlined in
    // IndexTopNav below) — אסופות is instead a plain link to the home
    // page's own About section (the collections overview, same target
    // "אודות" itself points to), matching collection-circle.html's own
    // אסופות target.
    const NAV_ITEMS = [
      { label: "אסופות", href: "index.html#about" },
      { label: "חיפוש", href: "#search" },
      { label: "אודות", href: "about.html" },
    ];

    function NavLink({ label, href, onClick }) {
      const [visible, setVisible] = useState(false);
      const [origin, setOrigin] = useState("right");
      const [resetKey, setResetKey] = useState(0);
      const rafIds = useRef([]);

      function clearRafs() {
        rafIds.current.forEach((id) => cancelAnimationFrame(id));
        rafIds.current = [];
      }
      function handleEnter() {
        // Clicking a focusable link fires onFocus even though the mouse
        // never left — without this guard that replays the whole closed-
        // then-sweep-in animation as a visible glitch right at the click.
        if (visible) return;
        clearRafs();
        setOrigin("right");
        setVisible(false);
        setResetKey((k) => k + 1);
        rafIds.current.push(requestAnimationFrame(() => {
          rafIds.current.push(requestAnimationFrame(() => setVisible(true)));
        }));
      }
      function handleLeave() {
        clearRafs();
        setOrigin("left");
        setVisible(false);
      }
      const clipPath = visible ? "inset(0 0 0 0)" : origin === "right" ? "inset(0 0 0 100%)" : "inset(0 100% 0 0)";

      return (
        <a
          href={href}
          onClick={onClick}
          onMouseEnter={handleEnter}
          onMouseLeave={handleLeave}
          onFocus={handleEnter}
          onBlur={handleLeave}
          className="relative inline-block text-[#28282a]"
          style={{ textDecoration: "none" }}
        >
          {label}
          <span
            key={resetKey}
            aria-hidden="true"
            className="absolute inset-0 pointer-events-none"
            style={{
              color: "transparent",
              userSelect: "none",
              textDecorationLine: "underline",
              textDecorationColor: "#28282a",
              textDecorationThickness: UNDERLINE_THICKNESS,
              textUnderlineOffset: UNDERLINE_OFFSET,
              textDecorationSkipInk: "auto",
              clipPath,
              transition: "clip-path 0.16s ease",
            }}
          >
            {label}
          </span>
        </a>
      );
    }

    // Same underline-sweep-on-hover as NavLink, but for a controlled sweep
    // (driven by a Card's own hover state) rather than the span's own mouse
    // events — used so hovering an artwork's image also sweeps its
    // caption's underline.
    function HoverWord({ label, active, style, className }) {
      const [visible, setVisible] = useState(false);
      const [origin, setOrigin] = useState("right");
      const [resetKey, setResetKey] = useState(0);
      const rafIds = useRef([]);

      function clearRafs() {
        rafIds.current.forEach((id) => cancelAnimationFrame(id));
        rafIds.current = [];
      }
      function open() {
        clearRafs();
        setOrigin("right");
        setVisible(false);
        setResetKey((k) => k + 1);
        rafIds.current.push(requestAnimationFrame(() => {
          rafIds.current.push(requestAnimationFrame(() => setVisible(true)));
        }));
      }
      function close() {
        clearRafs();
        setOrigin("left");
        setVisible(false);
      }

      useEffect(() => {
        if (active) open(); else close();
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [active]);

      const clipPath = visible ? "inset(0 0 0 0)" : origin === "right" ? "inset(0 0 0 100%)" : "inset(0 100% 0 0)";

      return (
        <span className={"relative inline-block text-[#28282a]" + (className ? " " + className : "")} style={style}>
          {label}
          <span
            key={resetKey}
            aria-hidden="true"
            className="absolute inset-0 pointer-events-none"
            style={{
              color: "transparent",
              userSelect: "none",
              textDecorationLine: "underline",
              textDecorationColor: "#28282a",
              textDecorationThickness: UNDERLINE_THICKNESS,
              textUnderlineOffset: UNDERLINE_OFFSET,
              textDecorationSkipInk: "auto",
              clipPath,
              transition: "clip-path 0.16s ease",
            }}
          >
            {label}
          </span>
        </span>
      );
    }

    // Nav row: אסופות (plain, rightmost) — אינדקס (current, hardcoded
    // underline) — חיפוש — אודות (leftmost), matching the reference
    // recording's header exactly (see frame_00 crop: אינדקס is the only
    // underlined item, sitting between אסופות and חיפוש).
    function IndexTopNav({ onSearchToggle }) {
      return (
        <nav
          id="ci-nav"
          className="flex items-center gap-5 pointer-events-auto"
          dir="rtl"
          style={{ fontFamily: FONT_THEBASICS, fontSize: scalePx(20), letterSpacing: "0.2px" }}
        >
          {/* Same skipIntro/scrollToAbout handoff as collection-circle.html's
              own אסופות link — lands directly on index.html's About section
              instead of the hero. */}
          <NavLink
            label={NAV_ITEMS[0].label}
            href={NAV_ITEMS[0].href}
            onClick={() => {
              sessionStorage.setItem("skipIntro", "1");
              sessionStorage.setItem("scrollToAbout", "1");
            }}
          />
          <span
            className="inline-block"
            style={{
              textDecorationLine: "underline",
              textDecorationColor: "#28282a",
              textDecorationThickness: UNDERLINE_THICKNESS,
              textUnderlineOffset: UNDERLINE_OFFSET,
              textDecorationSkipInk: "auto",
            }}
          >
            אינדקס
          </span>
          <NavLink
            label={NAV_ITEMS[1].label}
            href={NAV_ITEMS[1].href}
            // "חיפוש" doesn't navigate — it toggles the search bar (see
            // SearchBar/App). stopPropagation keeps this same click from
            // also being seen by SearchBar's document-level away-listener,
            // which would otherwise immediately close what this just opened.
            onClick={(e) => { e.preventDefault(); e.stopPropagation(); onSearchToggle(); }}
          />
          <NavLink label={NAV_ITEMS[2].label} href={NAV_ITEMS[2].href} />
        </nav>
      );
    }

    const SEARCH_FADE_MS = 180;
    const SEARCH_PLACEHOLDER = "חפש.י לפי אסופה, יצירה או יוצר.ת...";
    const SEARCH_MAX_RESULTS = 8;
    const CARET_BLINK_MS = 530;

    // Matching lives in search-engine.js so this dropdown and the full results
    // page (search.html) can never disagree about what a query means. It
    // returns the complete list; the dropdown shows the first
    // SEARCH_MAX_RESULTS and links the rest through to search.html.
    function searchArtworks(query) {
      return window.MuseumSearch.run(query).results;
    }

    function SearchBar({ open, onClose }) {
      const [mounted, setMounted] = useState(false);
      const [visible, setVisible] = useState(false);
      const [query, setQuery] = useState("");
      const rafIds = useRef([]);
      const closeTimer = useRef(null);
      const wrapperRef = useRef(null);
      const inputRef = useRef(null);
      const allResults = searchArtworks(query);
      const results = allResults.slice(0, SEARCH_MAX_RESULTS);

      function goToResult(art) {
        window.location.href = "artwork.html?id=" + art.id;
      }

      { id: "1930:2882", artworkId: "ancient-mold-modern-figurine", x: 422, y: 8499, w: 422, h: 344, imgX: 0, imgW: 422, imgH: 324, image: "public/refrence/index-page/גריין/תבנית עתיקה וצלמית מודרנית.webp", thumb: "public/images/index/idx106.webp", title: "תבנית עתיקה וצלמית מודרנית", subtitle: "המאה ה‑14‑13 לספירה", description: "שני אובייקטים זה לצד זה: התבנית המקורית וההטבעה שיצאה ממנה. דימוי כפול של אותה דמות..." },
      { id: "1930:2866", artworkId: "athena-intaglio", x: 24, y: 8685, w: 390, h: 522, imgX: 0, imgW: 390, imgH: 503, image: "public/refrence/index-page/גריין/תגליף אתנה.webp", thumb: "public/images/index/idx107.webp", title: "תגליף המתאר את אתנה", subtitle: "המאה ה‑1 לספירה", description: "תגליף (אינטָליוֹ) חרוט באבן קרניאול בצורה אובלית..." },
    ];

    const CARD_CAPTION_GAP = 0;
    const CARD_CAPTION_LINE_H = 20;

    function layoutCards(cards) {
      return cards.map((card) => ({ ...card, renderedH: card.h }));
    }
    const LAID_OUT_CARDS = layoutCards(CARDS);
    const LAST_CARD_BOTTOM = Math.max(...LAID_OUT_CARDS.map((c) => c.y + c.renderedH));

    // Same footer-offset derivation as collection-circle.html: relative to
    // wherever the cards actually end, not a fixed Figma canvas height.
    const FOOTER_LINKS_TOP = LAST_CARD_BOTTOM + 140;
    const FOOTER_PARAGRAPH_TOP = FOOTER_LINKS_TOP - 48;
    const FOOTER_WORDMARK_TOP = FOOTER_LINKS_TOP + 75;
    const CANVAS_H = FOOTER_WORDMARK_TOP + 170 + 40;

    // Coordinates the tile reveal across every Card: one shared
    // IntersectionObserver watches all card wrappers, staggering reveals
    // right-to-left (same convention as collection-circle.html's own
    // scheduleTileReveal — see its comment for the full rationale,
    // including the scroll-event backstop for big single-frame jumps).
    const TILE_STAGGER_MS = 50;
    const TILE_TRIGGER_FRAC = 0.2;
    let tileRevealObserver = null;
    let tileRevealClock = 0;
    const tileRevealCallbacks = new Map();
    let scrollListenerAttached = false;
    let scrollCheckQueued = false;

    function revealTiles(els) {
      els.sort((a, b) => Number(b.dataset.tileX) - Number(a.dataset.tileX));
      els.forEach((el) => {
        tileRevealObserver.unobserve(el);
        const cb = tileRevealCallbacks.get(el);
        if (!cb) return;
        tileRevealCallbacks.delete(el);
        const now = Date.now();
        const at = Math.max(now, tileRevealClock + TILE_STAGGER_MS);
        tileRevealClock = at;
        setTimeout(cb, at - now);
      });
    }

    function checkPendingTiles() {
      scrollCheckQueued = false;
      const triggerLine = window.innerHeight * (1 - TILE_TRIGGER_FRAC);
      const ready = [];
      tileRevealCallbacks.forEach((_, el) => {
        const rect = el.getBoundingClientRect();
        if (rect.top < triggerLine || rect.bottom < 0) ready.push(el);
      });
      if (ready.length) revealTiles(ready);
    }

    function ensureTileScrollBackstop() {
      if (scrollListenerAttached) return;
      scrollListenerAttached = true;
      window.addEventListener(
        "scroll",
        () => {
          if (scrollCheckQueued) return;
          scrollCheckQueued = true;
          requestAnimationFrame(checkPendingTiles);
        },
        { passive: true }
      );
    }

    function scheduleTileReveal(el, onReveal) {
      ensureTileScrollBackstop();
      if (!tileRevealObserver) {
        tileRevealObserver = new IntersectionObserver(
          (entries) => {
            const entering = entries.filter((e) => e.isIntersecting).map((e) => e.target);
            if (entering.length) revealTiles(entering);
          },
          { rootMargin: `0px 0px -${TILE_TRIGGER_FRAC * 100}% 0px`, threshold: 0 }
        );
      }
      tileRevealCallbacks.set(el, onReveal);
      tileRevealObserver.observe(el);
    }

    // Maps an index tile to its artwork.html detail page, when one exists.
    // card.artworkId is precomputed (offline, by matching this file's tile
    // titles against artworks-data.js and every collection-*.html's card
    // titles, tolerating punctuation/spelling drift between the three) —
    // see /tmp/index_artwork_map.json generation for the matching logic if
    // this ever needs to be redone. Not every one of the 107 tiles has a
    // detail page yet, so unmatched tiles just render without a link.
    function artworkHrefFor(card) {
      return card.artworkId ? "artwork.html?id=" + card.artworkId : null;
    }

    // Remembers exactly where on the grid the user was standing before they
    // clicked into a detail page, so the browser back button can drop them
    // back on the same tile instead of resetting to the top of the index.
    // Restored in App()'s mount effect, gated to actual back/forward
    // navigations (see there for why). Also remembers which card it was
    // (indexLastCardId), so that card's <img> can skip loading="lazy" —
    // without that, a tile far below the fold that native lazy-loading
    // hadn't fetched yet would flash in empty right after the instant
    // scroll jump, instead of already being loaded like the rest of the
    // page appears to be.
    function goToArtwork(href, cardId) {
      sessionStorage.setItem("indexScrollY", String(window.scrollY));
      sessionStorage.setItem("indexLastCardId", cardId);
      window.location.href = href;
    }

    const HOVER_OPACITY = 0.35;
    const HOVER_OPACITY_MS = 50;
    const TYPEWRITER_CHAR_MS = 4;
    // Same top-anchored convention as collection-circle.html's own Card:
    // the description sits just below the image's real visible top edge,
    // Description overlay: 11px from image top, 11px left / 6px right inset, fills full image height.
    // Figma Variant3: text node x=11, w=imgW-17, y=348 (near bottom) but h=512 (full text block).

    function Card({ card }) {
      const [loaded, setLoaded] = useState(false);
      const [revealed, setRevealed] = useState(false);
      const [hovered, setHovered] = useState(false);
      const [settled, setSettled] = useState(false);
      const wrapperRef = useRef(null);

      useEffect(() => {
        const el = wrapperRef.current;
        if (!el) return;
        scheduleTileReveal(el, () => setRevealed(true));
      }, []);

      const [typedLength, setTypedLength] = useState(0);
      useEffect(() => {
        if (!card.description) return;
        const typingIn = hovered;
        const id = setInterval(() => {
          setTypedLength((n) => {
            const done = typingIn ? n >= card.description.length : n <= 0;
            if (done) {
              clearInterval(id);
              return n;
            }
            return typingIn ? n + 1 : n - 1;
          });
        }, TYPEWRITER_CHAR_MS);
        return () => clearInterval(id);
      }, [hovered]);

      const isRevealed = loaded && revealed;
      useEffect(() => {
        if (!isRevealed) return;
        const id = setTimeout(() => setSettled(true), TILE_FADE_MS);
        return () => clearTimeout(id);
      }, [isRevealed]);

      const artworkHref = artworkHrefFor(card);

      return (
        <div
          id={card.thumb.replace(/.*\/(idx\d+)\.jpg.*/, "tile-$1")}
          ref={wrapperRef}
          data-tile-x={card.x}
          className="absolute"
          style={{
            left: scalePx(card.x),
            top: scalePx(card.y),
            width: scalePx(card.w),
          }}
        >
          {/* Content block: image + caption in flex column, offset by imgX.
              min-height preserves the Figma-designed tile height as a floor,
              so the caption zone (h − imgH pixels) is always present and the
              caption row is vertically centred within it. */}
          <div style={{
            marginLeft: scalePx(card.imgX),
            width: scalePx(card.imgW),
            minHeight: scalePx(card.h),
            display: "flex",
            flexDirection: "column",
          }}>
            <img
              src={card.thumb || card.image}
              alt={card.title}
              loading={sessionStorage.getItem("indexLastCardId") === card.id ? "eager" : "lazy"}
              onLoad={() => setLoaded(true)}
              className="block pointer-events-none"
              style={{
                width: scalePx(card.imgW),
                height: scalePx(card.imgH),
                objectFit: "cover",
                clipPath: "inset(1px)",
                opacity: !isRevealed ? 0 : hovered ? HOVER_OPACITY : 1,
                transition: `opacity ${settled ? HOVER_OPACITY_MS : TILE_FADE_MS}ms ease-in`,
              }}
            />
            {/* Caption zone: flex: 1 takes the remaining space (h − imgH).
                paddingTop matches Figma's ~4px image-to-caption gap. */}
            <div style={{ flex: 1, display: "flex", alignItems: "flex-start", paddingTop: scalePx(4) }}>
              <div
                className="caption-container-row"
                style={{
                  zIndex: 1,
                  fontFamily: FONT_THEBASICS,
                  fontWeight: 500,
                  fontSize: scalePx(16),
                  lineHeight: "15px",
                  letterSpacing: 0,
                }}
              >
                <HoverWord label={card.title} active={hovered} className="caption-title-side" />
                <HoverWord label={card.subtitle} active={hovered} className="caption-metadata-side" />
              </div>
            </div>
          </div>
          {/* Hover hitbox: absolutely positioned over the image area. Also
              the click target into artwork.html, when this tile has a
              detail page (see artworkHrefFor — not every tile does yet). */}
          <div
            className="absolute pointer-events-auto"
            style={{
              left: scalePx(card.imgX), top: 0, width: scalePx(card.imgW), height: scalePx(card.imgH),
              cursor: artworkHref ? "pointer" : undefined,
            }}
            onMouseEnter={() => setHovered(true)}
            onMouseLeave={() => setHovered(false)}
            onClick={() => { if (artworkHref) goToArtwork(artworkHref, card.id); }}
          />
          {/* Hover description: top-anchored 11px from image top, 11px left / 6px right inset, fills full image height. */}
          {card.description && (
            <div
              className="absolute overflow-hidden pointer-events-none text-right"
              dir="rtl"
              style={{
                left: scalePx(card.imgX + 11),
                top: scalePx(11),
                width: scalePx(card.imgW - 17),
                height: scalePx(card.imgH - 11),
                fontFamily: FONT_THEBASICS,
                fontWeight: 500,
                fontSize: scalePx(16),
                lineHeight: "121%",
                color: "#28282a",
                opacity: isRevealed && (hovered || typedLength > 0) ? 1 : 0,
                transition: `opacity ${settled ? HOVER_OPACITY_MS : TILE_FADE_MS}ms ease-in`,
              }}
            >
              {card.description.slice(0, typedLength)}
            </div>
          )}
        </div>
      );
    }

    function ListView() {
      const HEADER_LABELS = ["שם היצירה", "יוצר/ת", "טכניקה", `מימדים (ס"מ)`];
      const clusterRef = useRef(new Map()); // idx → { el, hideTimer }

      useEffect(() => {
        return () => {
          clusterRef.current.forEach(({ el, hideTimer }) => {
            clearTimeout(hideTimer);
            el.remove();
          });
          clusterRef.current.clear();
        };
      }, []);

      const handleRowEnter = useCallback((src, rowEl, idx) => {
        const cluster = clusterRef.current;
        const existing = cluster.get(idx);
        if (existing) {
          clearTimeout(existing.hideTimer);
          existing.el.classList.remove("leaving");
          return;
        }
        const slot = PREVIEW_SLOTS[idx % PREVIEW_SLOTS.length];
        let top = 80;
        if (rowEl) {
          const r = rowEl.getBoundingClientRect();
          top = Math.max(8, Math.min(r.top + r.height / 2 + slot.dy, window.innerHeight - 520));
        }
        const el = document.createElement("div");
        el.className = "artwork-cluster-img";
        el.style.cssText = `position:fixed;pointer-events:auto;z-index:9999;left:${slot.left};top:${top}px;opacity:0;transform:scale(0.96);transition:opacity 120ms cubic-bezier(0.16,1,0.3,1),transform 120ms cubic-bezier(0.16,1,0.3,1);background:none;border:none;outline:none;box-shadow:none;filter:none;cursor:default;`;
        const img = document.createElement("img");
        img.alt = "";
        img.src = src;
        const card = CARDS[idx];
        const tier = SIZE_TIERS[(idx * 5 + Math.floor(idx / 3)) % SIZE_TIERS.length];
        const pW = card?.previewW || tier.w;
        const pMinW = card?.previewMinW || tier.minW;
        const pMaxW = card?.previewMaxW || tier.maxW;
        const pMaxH = card?.previewMaxH || tier.maxH;
        const pFit = card?.previewFit || "contain";
        const pAspect = card?.previewAspect ? `aspect-ratio:${card.previewAspect};` : "";
        const pTransform = card?.previewTransform || "";
        img.style.cssText = `width:${pW};min-width:${pMinW};max-width:${pMaxW};max-height:${pMaxH};${pAspect}object-fit:${pFit};display:block;background:none;background-color:transparent;border:none;border-color:transparent;outline:none;box-shadow:none;filter:none;mix-blend-mode:multiply;pointer-events:none;${pTransform ? `transform:${pTransform};transform-origin:center center;` : ""}`;
        el.appendChild(img);
        document.body.appendChild(el);
        requestAnimationFrame(() => { el.style.opacity = "1"; el.style.transform = "scale(1)"; });
        // Keep image visible while cursor is over it
        el.addEventListener("mouseenter", () => {
          const entry = clusterRef.current.get(idx);
          if (entry) clearTimeout(entry.hideTimer);
        });
        el.addEventListener("mouseleave", () => handleRowLeave(idx));
        cluster.set(idx, { el, hideTimer: null });
        if (cluster.size > CLUSTER_MAX) {
          const oldest = cluster.keys().next().value;
          const old = cluster.get(oldest);
          clearTimeout(old.hideTimer);
          old.el.remove();
          cluster.delete(oldest);
        }
      }, []);

      const handleRowLeave = useCallback((idx) => {
        const cluster = clusterRef.current;
        const entry = cluster.get(idx);
        if (!entry) return;
        const timer = setTimeout(() => {
          entry.el.style.transition = "opacity 100ms ease-out";
          entry.el.style.opacity = "0";
          setTimeout(() => { entry.el.remove(); cluster.delete(idx); }, 100);
        }, 500);
        entry.hideTimer = timer;
      }, []);

      return (

            </div>
            <p

      // this load is an actual browser back/forward navigation, not a fresh
      // arrival via the אינדקס nav link (which should land at the top like
      // normal). Card layout is fixed-pixel (not image-load-dependent), so
      // the scroll target is valid immediately, no need to wait for content.
      useEffect(() => {
        const navEntry = performance.getEntriesByType("navigation")[0];
        const isBackForward = navEntry
          ? navEntry.type === "back_forward"
          : performance.navigation && performance.navigation.type === 2;
        if (!isBackForward) return;
        const saved = sessionStorage.getItem("indexScrollY");

  <script>
  /* Cursor-proximity transition speed system.
     Each tile gets --hover-speed updated every rAF frame via lerp.
     Closer tiles → faster opacity transitions; further tiles → slower. */
  (function () {
    var mouseX = -9999, mouseY = -9999;
    var SPEED_NEAR = 50;   // ms at cursor position
    var SPEED_FAR  = 500;  // ms far from cursor
    var MAX_DIST   = 700;  // px — distance at which SPEED_FAR is fully reached
    var LERP_K     = 0.08; // per-frame factor (~700ms to fully settle)

    var tiles  = null;
    var speeds = [];

    document.addEventListener('mousemove', function (e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
    }, { passive: true });

    document.addEventListener('mouseleave', function () {
      mouseX = -9999;
      mouseY = -9999;
    }, { passive: true });

    function tick() {
      // Lazy-init: wait until React has rendered the tile elements
      if (!tiles) {
        var found = document.querySelectorAll('[id^="tile-idx"]');
        if (!found.length) { requestAnimationFrame(tick); return; }
        tiles = Array.from(found);
        speeds = new Array(tiles.length).fill(SPEED_FAR);
      }

      // Phase 1: batch-read all rects to avoid layout thrashing
      var rects = new Array(tiles.length);
      for (var i = 0; i < tiles.length; i++) {
        rects[i] = tiles[i].getBoundingClientRect();
      }

      // Phase 2: compute target speed, lerp, write CSS custom property
      for (var i = 0; i < tiles.length; i++) {
        var r = rects[i];
        var nx = mouseX < r.left ? r.left : mouseX > r.right  ? r.right  : mouseX;
        var ny = mouseY < r.top  ? r.top  : mouseY > r.bottom ? r.bottom : mouseY;
        var dx = mouseX - nx, dy = mouseY - ny;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var t = dist < MAX_DIST ? dist / MAX_DIST : 1;
        var target = SPEED_NEAR + (SPEED_FAR - SPEED_NEAR) * t;
        speeds[i] = speeds[i] + (target - speeds[i]) * LERP_K;
        tiles[i].style.setProperty('--hover-speed', (speeds[i] | 0) + 'ms');
      }

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  })();
  </script>
