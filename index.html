<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>אוספי מוזיאון ישראל</title>
  <meta name="description" content="אוספי מוזיאון ישראל באינטרנט — כ-500 אלף פריטים מארכיאולוגיה, אמנות ואמנות יהודית, מוצגים בחמש אסופות נושאיות." />
  <link rel="icon" type="image/svg+xml" href="public/images/favicon.svg" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="artworks-data.js"></script>
  <script src="search-engine.js"></script>
  <!-- No custom fontFamily in the Tailwind config: the CDN build's JIT scanner
       doesn't pick up custom utility classes (like a would-be font-masada)
       from React-rendered className strings — confirmed with a minimal
       repro outside this file, it's a Tailwind Play CDN limitation, not a
       typo here. The FONT_* constants below (applied via inline style
       instead of a Tailwind class) are the actual fix. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @view-transition {
      navigation: auto;
    }
    ::view-transition-group(root) {
      animation-duration: 0.42s;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    ::view-transition-old(root),
    ::view-transition-new(root) {
      mix-blend-mode: normal;
    }
    /* The nav bar carries a persistent view-transition-name (site-header) so
       it morphs instead of cross-fading — but the browser still runs its
       default old/new fade *underneath* that morph, and since the two
       snapshots are almost-but-not-quite pixel-identical (font hinting,
       subpixel rounding) that reads as a flicker. Freezing it removes that. */
    ::view-transition-old(site-header),
    ::view-transition-new(site-header) {
      animation: none;
      mix-blend-mode: normal;
    }
    /* Also freeze the group's own position/size interpolation — otherwise
       even a 1px geometry mismatch between two pages' headers (they're
       hand-tuned per page) makes it visibly slide during the crossfade. */
    ::view-transition-group(site-header) {
      animation: none;
    }
    @font-face {
      font-family: 'TheBasics';
      src: url('public/fonts/TheBasics-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheBasics';
      src: url('public/fonts/TheBasics-MediumItalic.otf') format('opentype');
      font-weight: 500;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheBasics';
      src: url('public/fonts/TheBasics-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheBasics';
      src: url('public/fonts/TheBasics-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      background-color: #fffdfa;
      color: #28282a;
      font-family: 'TheBasics', 'Segoe UI', Arial, sans-serif;
      font-weight: 500;
    }

    html {
      scroll-behavior: smooth;
    }

    ::selection {
      background-color: #28282a;
      color: #fffdfa;
    }

  </style>
</head>
<body>
  <!-- No static JS-free header on this page (unlike the others) — index.html
       deliberately hides its nav until the intro reveal finishes on a fresh
       visit (see ix-header-overlay's own comment below), and has no header
       wordmark link at all since you're already home. A permanently-visible
       static header would fight both of those. -->
  <div id="root"></div>

  <script src="index.app.js"></script>
</body>
</html>
